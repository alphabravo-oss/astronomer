# golangci-lint v2 — STANDARD preset plus the repository policy below.
# Policy lives here, never on the CLI (Technology Selection Guide ch.04).
version: "2"

run:
  # ~3k Go files: the package-loading phase alone exhausts the 5m default.
  timeout: 15m
  tests: true
  # A lint run must never mutate go.mod / go.sum.
  modules-download-mode: readonly

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/alphabravocompany/astronomer-go
  exclusions:
    paths:
      - frontend
      - internal/db/sqlc
      - pkg/astroclient
      - internal/charlie/contract/pinned

linters:
  default: standard
  enable:
    # Complexity thresholds at the community golden-config baseline.
    - cyclop
    - gocognit
    - funlen
    - nestif
    # Test discipline (guide ch.07): t.Parallel() in every test and subtest.
    - paralleltest
    - tparallel
  settings:
    cyclop:
      max-complexity: 30
    gocognit:
      min-complexity: 20
    funlen:
      lines: 100
      statements: 50
    nestif:
      min-complexity: 5
    staticcheck:
      # golangci-lint's default staticcheck set with ST1005 added. `checks`
      # REPLACES the default, so the default entries are repeated verbatim.
      #
      # ST1005 ("error strings should not be capitalized") has no proper-noun
      # allowlist; every finding in this tree is an operator-facing message
      # that opens with a product name (Argo, Dex, Helm, Charlie). Lowercasing
      # product names is a copy change with no correctness value.
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1005
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
  exclusions:
    paths:
      - frontend
      - internal/db/sqlc
      - pkg/astroclient
      - internal/charlie/contract/pinned
      - tmp
    rules:
      # Phase 2 (Connect-RPC + handler/service/store split) rewrites the flat
      # handler package and the server composition root domain by domain. The
      # complexity linters are enforced on new code and on every package that
      # has already been extracted; the legacy paths below are exempt until
      # they are rewritten (tracked in docs/decisions/0007-rest-to-connect-rpc.md).
      - path: ^(internal/handler|internal/server|cmd/astro|internal/charlie|internal/delivery|internal/worker|internal/catalog|internal/ops|internal/tunnel|internal/agent|internal/crd|internal/scanner|internal/gitops|internal/astrocli|internal/auth|internal/db|internal/observability|internal/monitoring|internal/compliance|internal/notify|internal/webhook|internal/siem|internal/rbac|internal/toolui|internal/kubectl|internal/maintenance|internal/helmruntime|internal/httpclient|internal/registration|internal/credential|internal/cloudcreds|internal/dexconfig|internal/controlplane|internal/vault|internal/email|internal/quota|internal/projectquota|internal/projects|internal/audit|internal/anomaly|internal/apisvr|internal/netpol|internal/mesh|internal/dashboards|internal/gatekeeperpolicy|internal/lokiauth|internal/grafanaproxy|internal/events|internal/deferredreplay|internal/downstreamboundary|internal/jsoncontract|internal/pagination|internal/principal|internal/redaction|internal/reqctx|internal/sessionpolicy|internal/tableviews|internal/userpreferences|internal/metrics|internal/cacheinvalidate|internal/callerid|internal/config|internal/redisconn|internal/releasecontract|internal/kubeutil|internal/strutil|internal/operationstate|internal/platformsettings|internal/agentlifecycle|internal/agentcompat|internal/envconfig|internal/httpserver|cmd/|deploy/|pkg/|scripts/)
        linters:
          - cyclop
          - gocognit
          - funlen
          - nestif
      # Existing test files predate the t.Parallel() rule; they are retagged and
      # parallelised as each domain is rewritten (Phase 1 testing substrate).
      - path: _test\.go$
        linters:
          - paralleltest
          - tparallel
        text: .*
      # The composition roots and CLIs legitimately use init()/os.Exit.
      - path: ^cmd/
        linters:
          - gochecknoinits

issues:
  # Never truncate the report: a gate that hides findings is worse than none.
  max-issues-per-linter: 0
  max-same-issues: 0
