name: capture retained assistive-technology evidence
on:
  workflow_dispatch:
    inputs:
      tag: {description: "Exact v1 tag tested", required: true, type: string}
permissions: {contents: read, id-token: write}
jobs:
  capture:
    runs-on: [self-hosted, accessibility-evidence]
    environment: accessibility-raw-evidence
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {ref: "refs/tags/${{ inputs.tag }}", persist-credentials: false}
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with: {cosign-release: v2.5.3}
      - name: Capture files from the owned AT evidence runner
        env: {RAW_SOURCE_DIR: "${{ vars.ACCESSIBILITY_RAW_SOURCE_DIR }}", TARGET_TAG: "${{ inputs.tag }}"}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/tags/$TARGET_TAG" && test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -d "$RAW_SOURCE_DIR" && test ! -L "$RAW_SOURCE_DIR"
          install -d -m 0700 "$RUNNER_TEMP/accessibility-raw"
          cp -a "$RAW_SOURCE_DIR/." "$RUNNER_TEMP/accessibility-raw/"
          test -f "$RUNNER_TEMP/accessibility-raw/accessibility-records.json"
          python3 scripts/raw-human-evidence-manifest.py --root "$RUNNER_TEMP/accessibility-raw" --manifest "$RUNNER_TEMP/accessibility-raw/raw-manifest.json"
          cosign sign-blob --yes --bundle "$RUNNER_TEMP/accessibility-raw/raw-manifest.sigstore.json" "$RUNNER_TEMP/accessibility-raw/raw-manifest.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: "accessibility-raw-${{ github.run_id }}", path: "${{ runner.temp }}/accessibility-raw", if-no-files-found: error, retention-days: 365}
