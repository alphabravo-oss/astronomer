# Fresh-cluster end-to-end smoke test.
#
# Walks the full operator-onboarding flow against a real k3d cluster:
# wizard registration → agent install → baseline operators → kubectl
# shell open → trivy vuln reports flowing. This catches the class of
# regression that "bitnami/kubectl:1.31 404'd" + "SQLSTATE 42P08" hid
# for months — nothing else in CI exercises this path.
#
# Lives in workflows-disabled/ during dev (see .github/workflows/README.md).
# To activate: `mv` into workflows/.

name: smoke-fresh-cluster

on:
  pull_request:
    branches: [main]
  schedule:
    # 06:00 UTC daily — catches upstream regressions (alpine base image
    # security advisories, dl.k8s.io tag drift, helm-chart breakage)
    # without waiting for a PR to surface them.
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-22.04
    # Hard cap so a stuck wait never burns a full job-timeout budget.
    # The script's own per-step timeouts add up to ~13 minutes and the
    # one-time six-image build takes roughly 15 on a cold hosted runner.
    # Keep an outer bound while allowing the inner, step-specific timeouts to
    # identify the operation that failed.
    timeout-minutes: 40

    env:
      CGO_ENABLED: "0"
      DOCKER_BUILDKIT: "1"
      # NGF 2.6.0 requires Kubernetes >= 1.31. k3d 5.7 defaulted to 1.30.4.
      K3S_IMAGE: rancher/k3s:v1.32.8-k3s1

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Install k3d
        run: |
          curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh \
            | TAG=v5.8.3 bash

      - name: Bring up local Astronomer (k3d-bootstrap)
        run: |
          # k3d-bootstrap builds every first-party image exactly once and
          # imports that exact set into the fresh cluster. Building a partial
          # set here first duplicated almost the entire build and exhausted
          # this job's 25-minute qualification budget.
          make k3d-bootstrap CLUSTER=astronomer-mgmt IMG_TAG=ci

      - name: Resolve admin password
        id: creds
        run: |
          password=$(kubectl --context k3d-astronomer-mgmt -n astronomer \
            get secret astronomer-bootstrap -o jsonpath='{.data.password}' | base64 -d)
          # Mask before any later step accidentally echos it.
          echo "::add-mask::$password"
          echo "password=$password" >> "$GITHUB_OUTPUT"

      - name: Reclaim build cache before adopted-cluster import
        run: |
          # The tagged images are already imported into management-cluster
          # containerd and remain in Docker for the agent/shell import below.
          # BuildKit's intermediate layers are not runtime artifacts; retaining
          # them can push the one-node k3d management plane into DiskPressure
          # as soon as the adopted cluster imports its own images.
          docker builder prune --all --force
          docker image prune --force
          df -h /
          docker system df

      - name: Run smoke test
        env:
          ASTRO_URL: http://astronomer.localtest.me:8080
          ASTRO_EMAIL: admin@astronomer.local
          ASTRO_PASSWORD: ${{ steps.creds.outputs.password }}
          AGENT_IMAGE: ghcr.io/alphabravo-oss/astronomer-go-agent:ci
          SHELL_IMAGE: ghcr.io/alphabravo-oss/astronomer-shell:ci
        run: |
          ./scripts/smoke-fresh-cluster.sh

      - name: Dump cluster state on failure
        if: failure()
        run: |
          mkdir -p /tmp/smoke-artifacts
          for ctx in $(kubectl config get-contexts -o name); do
            kubectl --context "$ctx" get pods -A -o wide \
              > "/tmp/smoke-artifacts/${ctx}-pods.txt" 2>&1 || true
            kubectl --context "$ctx" get events -A --sort-by=.lastTimestamp \
              > "/tmp/smoke-artifacts/${ctx}-events.txt" 2>&1 || true
            kubectl --context "$ctx" describe nodes \
              > "/tmp/smoke-artifacts/${ctx}-nodes.txt" 2>&1 || true
            kubectl --context "$ctx" -n astronomer-system logs \
              --all-containers --tail=200 deploy/astronomer-agent \
              > "/tmp/smoke-artifacts/${ctx}-agent.log" 2>&1 || true
          done
          kubectl --context k3d-astronomer-mgmt -n astronomer logs \
            deploy/astronomer-server -c server --tail=400 \
            > /tmp/smoke-artifacts/server.log 2>&1 || true

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-debug-${{ github.run_id }}
          path: /tmp/smoke-artifacts/
          retention-days: 7
