name: release

# One vX.Y.Z (or vX.Y.Z-rc.N release-candidate) tag -> six exact image tags (amd64+arm64), each signed with
# cosign keyless and carrying an SPDX SBOM attestation, plus the OCI Helm chart.
# Images are built through the same Dockerfiles and GO_VERSION derivation as
# `make docker-build`.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: alphabravo-oss
  COSIGN_VERSION: v3.1.3

jobs:
  preflight:
    name: validate release identity
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.identity.outputs.version }}
      go_version: ${{ steps.identity.outputs.go_version }}
      go_image_digest: ${{ steps.identity.outputs.go_image_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: identity
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # vX.Y.Z or a release candidate vX.Y.Z-rc.N. The chart in git always
          # carries the base X.Y.Z; a candidate is packaged with the full tag.
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]
          version="${TAG#v}"
          version="${version%%-rc.*}"
          test "$(awk '$0 ~ /^version:[[:space:]]/ { print $2; exit }' deploy/chart/Chart.yaml)" = "$version"
          test "$(awk '$0 ~ /^appVersion:[[:space:]]/ { gsub(/"/, "", $2); print $2; exit }' deploy/chart/Chart.yaml)" = "$version"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "go_version=$(awk '/^go /{print $2}' go.mod)" >> "$GITHUB_OUTPUT"
          make go-image-check
          echo "go_image_digest=$(awk '$1 == "GO_IMAGE_DIGEST" { print $3 }' deploy/docker/go-image.lock)" >> "$GITHUB_OUTPUT"

  build-sign:
    name: build · sign · attest
    needs: preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component:
          - { name: server,   context: .,        dockerfile: deploy/docker/Dockerfile.server,  image: astronomer-go-server }
          - { name: worker,   context: .,        dockerfile: deploy/docker/Dockerfile.worker,  image: astronomer-go-worker }
          - { name: agent,    context: .,        dockerfile: deploy/docker/Dockerfile.agent,   image: astronomer-go-agent }
          # kubectl is the upstream release binary (latest v1.35 patch), built by
          # Kubernetes with go1.26.8; its stdlib/x/net findings are tracked in
          # docs/security-exceptions.md, not fixable here.
          - { name: shell,    context: .,        dockerfile: deploy/docker/Dockerfile.shell,   image: astronomer-shell, trivy_skip_files: /usr/local/bin/kubectl }
          - { name: dr,       context: .,        dockerfile: deploy/docker/Dockerfile.dr,      image: astronomer-dr }
          - { name: frontend, context: frontend, dockerfile: frontend/Dockerfile,              image: astronomer-frontend }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - id: meta
        run: echo "build_date=$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
      - name: Refuse to overwrite an existing exact tag
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.component.image }}:${{ needs.preflight.outputs.version }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "refusing to overwrite immutable image tag $IMAGE" >&2; exit 1
          fi
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.component.context }}
          file: ${{ matrix.component.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            GO_VERSION=${{ needs.preflight.outputs.go_version }}
            GO_IMAGE_DIGEST=${{ needs.preflight.outputs.go_image_digest }}
            VERSION=${{ needs.preflight.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.component.image }}:${{ needs.preflight.outputs.version }}
          provenance: mode=max
          sbom: false
      - name: Scan image (HIGH/CRITICAL fail)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.component.image }}@${{ steps.build.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-files: ${{ matrix.component.trivy_skip_files }}
          exit-code: "1"
      - name: Sign by digest
        env:
          COSIGN_YES: "true"
        run: cosign sign "${REGISTRY}/${IMAGE_OWNER}/${{ matrix.component.image }}@${{ steps.build.outputs.digest }}"
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Attest SBOM
        env:
          COSIGN_YES: "true"
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.component.image }}@${{ steps.build.outputs.digest }}
        run: |
          syft "$IMAGE_REF" -o spdx-json > "sbom-${{ matrix.component.name }}.spdx.json"
          cosign attest --predicate "sbom-${{ matrix.component.name }}.spdx.json" --type spdxjson "$IMAGE_REF"
          printf '%s\n' "$IMAGE_REF" > "${{ matrix.component.name }}.digest"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.component.name }}-${{ needs.preflight.outputs.version }}
          path: |
            sbom-${{ matrix.component.name }}.spdx.json
            ${{ matrix.component.name }}.digest
          retention-days: 90

  fips-build:
    name: FIPS binaries (GOEXPERIMENT=boringcrypto, -tags fips)
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make fips-build VERSION=${{ needs.preflight.outputs.version }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fips-binaries-${{ needs.preflight.outputs.version }}
          path: bin/fips/

  chart:
    name: publish signed OCI chart
    needs: [preflight, build-sign]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - env:
          VERSION: ${{ needs.preflight.outputs.version }}
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          make helm-lint
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "$REGISTRY" --username "${{ github.actor }}" --password-stdin
          helm dependency build deploy/chart
          base="$(awk '$0 ~ /^version:[[:space:]]/ { print $2; exit }' deploy/chart/Chart.yaml)"
          if [ "${VERSION#v}" != "$base" ]; then
            # Release candidate: default image tags follow the candidate tag.
            sed -i "s/tag: \"v${base}\"/tag: \"${VERSION}\"/" deploy/chart/values.yaml
          fi
          helm package deploy/chart --destination dist --version "${VERSION#v}" --app-version "${VERSION#v}"
          out="$(helm push "dist/astronomer-${VERSION#v}.tgz" "oci://${REGISTRY}/${IMAGE_OWNER}/charts" 2>&1)"; echo "$out"
          digest="$(echo "$out" | sed -n 's/^Digest: //p')"
          cosign sign "${REGISTRY}/${IMAGE_OWNER}/charts/astronomer@${digest}"
