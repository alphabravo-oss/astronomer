name: resume interrupted release

# Exact artifacts are deliberately immutable, so a release that stops after
# publishing them cannot safely rerun the tag workflow. This operator-only
# path validates the original run and its artifacts, repeats clean-cluster
# qualification, and publishes only the withheld immutable GitHub release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable vX.Y.Z tag to qualify
        required: true
        type: string
      source_run_id:
        description: Failed or cancelled release workflow run that built the artifacts
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: alphabravo-oss
  CHARLIE_QUALIFIED_VERSION: ${{ vars.CHARLIE_QUALIFIED_VERSION }}
  CHARLIE_ARTIFACT_REFERENCE: ${{ vars.CHARLIE_ARTIFACT_REFERENCE }}
  CHARLIE_CAPABILITY_DISCLOSURE_DIGEST: ${{ vars.CHARLIE_CAPABILITY_DISCLOSURE_DIGEST }}
  CHARLIE_CERTIFICATE_IDENTITY: ${{ vars.CHARLIE_CERTIFICATE_IDENTITY }}
  CHARLIE_CERTIFICATE_OIDC_ISSUER: ${{ vars.CHARLIE_CERTIFICATE_OIDC_ISSUER }}

jobs:
  preflight:
    name: verify interrupted release identity and artifacts
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.identity.outputs.image_tag }}
      chart-version: ${{ steps.identity.outputs.chart_version }}
      tag-commit: ${{ steps.identity.outputs.tag_commit }}
      metadata-required: ${{ steps.identity.outputs.metadata_required }}
      metadata-run-id: ${{ steps.identity.outputs.metadata_run_id }}
    steps:
      - name: Checkout immutable tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag and original release run
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$REPOSITORY" = "alphabravo-oss/astronomer"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]

          tag_commit="$(git rev-parse 'HEAD^{commit}')"
          test "$(git rev-parse "refs/tags/${TAG}^{commit}")" = "$tag_commit"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$tag_commit" origin/main

          chart_version="${TAG#v}"
          test "$(awk '$0 ~ /^version:[[:space:]]/ { print $2; exit }' deploy/chart/Chart.yaml)" = "$chart_version"
          test "$(awk '$0 ~ /^appVersion:[[:space:]]/ { gsub(/\"/, "", $2); print $2; exit }' deploy/chart/Chart.yaml)" = "$chart_version"

          run_json="$(gh api "repos/${REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          test "$(jq -r .event <<<"$run_json")" = "push"
          test "$(jq -r .head_sha <<<"$run_json")" = "$tag_commit"
          test "$(jq -r .head_branch <<<"$run_json")" = "$TAG"
          test "$(jq -r .path <<<"$run_json")" = ".github/workflows/release.yaml"
          test "$(jq -r .status <<<"$run_json")" = "completed"
          case "$(jq -r .conclusion <<<"$run_json")" in
            failure|cancelled) ;;
            *) echo "source run is not an interrupted release" >&2; exit 1 ;;
          esac

          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists; refusing duplicate promotion" >&2
            exit 1
          fi

          artifacts="$(gh api --paginate "repos/${REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | .name')"
          for name in delivery-artifacts server worker agent migrate shell dr frontend; do
            case "$name" in
              chart) expected="chart-${TAG}" ;;
              delivery-artifacts) expected="delivery-artifacts-${TAG}" ;;
              *) expected="sbom-${name}-${TAG}" ;;
            esac
            grep -Fxq "$expected" <<<"$artifacts"
          done

          metadata_required=false
          metadata_run_id="$SOURCE_RUN_ID"
          if ! grep -Fxq "chart-${TAG}" <<<"$artifacts"; then
            test "$TAG" = v1.2.0
            test "$tag_commit" = 4a9986c22a582d71273da61e398b03f0dde4e8d8
            test "$SOURCE_RUN_ID" = 37705872945
            test "$GITHUB_REF" = refs/heads/main
            metadata_required=true
            metadata_run_id="$GITHUB_RUN_ID"
          fi
          echo "metadata_required=$metadata_required" >> "$GITHUB_OUTPUT"
          echo "metadata_run_id=$metadata_run_id" >> "$GITHUB_OUTPUT"

          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "chart_version=$chart_version" >> "$GITHUB_OUTPUT"
          echo "tag_commit=$tag_commit" >> "$GITHUB_OUTPUT"

      - name: Check build capacity
        run: ./scripts/check-build-capacity.sh --path .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Download original release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          pattern: '*-${{ steps.identity.outputs.image_tag }}'
          path: source-artifacts
          merge-multiple: true

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: "v2.4.1"

      - name: Verify exact signed multi-platform images
        env:
          IMAGE_TAG: ${{ steps.identity.outputs.image_tag }}
        run: |
          set -euo pipefail
          identity="https://github.com/alphabravo-oss/astronomer/.github/workflows/release.yaml@refs/tags/${IMAGE_TAG}"
          for pair in \
            server:astronomer-go-server \
            worker:astronomer-go-worker \
            agent:astronomer-go-agent \
            migrate:astronomer-go-migrate \
            shell:astronomer-shell \
            dr:astronomer-dr \
            frontend:astronomer-frontend; do
            component="${pair%%:*}"
            image="${pair#*:}"
            ref="${REGISTRY}/${IMAGE_OWNER}/${image}:${IMAGE_TAG}"
            docker buildx imagetools inspect "$ref" --raw > manifest.json
            expected_ref="$(cat "source-artifacts/${component}.digest")"
            expected_repository="${REGISTRY}/${IMAGE_OWNER}/${image}"
            test "${expected_ref%@*}" = "$expected_repository"
            # Consume all Buildx output. Exiting awk on the first Digest line
            # closes the pipe early and makes Buildx fail with SIGPIPE under
            # `set -o pipefail`.
            actual_digest="$(docker buildx imagetools inspect "$ref" \
              | awk '$1 == "Digest:" && digest == "" { digest=$2 } END { if (digest != "") print digest }')"
            test -n "$actual_digest"
            test "${expected_ref#*@}" = "$actual_digest"
            jq -e '
              [.manifests[].platform | (.os + "/" + .architecture)] as $platforms
              | ($platforms | index("linux/amd64")) != null
                and ($platforms | index("linux/arm64")) != null
            ' manifest.json >/dev/null
            cosign verify \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$ref" >/dev/null
          done

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.16.2

      - name: Verify exact published chart
        if: steps.identity.outputs.metadata_required != 'true'
        env:
          CHART_VERSION: ${{ steps.identity.outputs.chart_version }}
          IMAGE_TAG: ${{ steps.identity.outputs.image_tag }}
        run: |
          set -euo pipefail
          mkdir registry-chart
          helm pull oci://ghcr.io/alphabravo-oss/charts/astronomer \
            --version "$CHART_VERSION" --destination registry-chart
          cmp \
            "source-artifacts/astronomer-${CHART_VERSION}.tgz" \
            "registry-chart/astronomer-${CHART_VERSION}.tgz"
          chart_ref="$(cat source-artifacts/chart.digest)"
          [[ "$chart_ref" =~ ^ghcr\.io/alphabravo-oss/charts/astronomer@sha256:[a-f0-9]{64}$ ]]
          cosign verify \
            --certificate-identity "https://github.com/alphabravo-oss/astronomer/.github/workflows/release.yaml@refs/tags/${IMAGE_TAG}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$chart_ref" >/dev/null
          gh attestation verify "source-artifacts/astronomer-${CHART_VERSION}.tgz" \
            --repo "$GITHUB_REPOSITORY" >/dev/null
          helm show chart "registry-chart/astronomer-${CHART_VERSION}.tgz" > chart-metadata.yaml
          test "$(awk '$0 ~ /^version:[[:space:]]/ { print $2; exit }' chart-metadata.yaml)" = "$CHART_VERSION"
          app_version="$(awk '$0 ~ /^appVersion:[[:space:]]/ { gsub(/\"/, "", $2); print $2; exit }' chart-metadata.yaml)"
          test "$app_version" = "$CHART_VERSION"

      - name: Verify signed release manifest and delivery subjects
        if: steps.identity.outputs.metadata_required != 'true'
        env:
          IMAGE_TAG: ${{ steps.identity.outputs.image_tag }}
          TAG_COMMIT: ${{ steps.identity.outputs.tag_commit }}
        run: |
          set -euo pipefail
          identity="https://github.com/alphabravo-oss/astronomer/.github/workflows/release.yaml@refs/tags/${IMAGE_TAG}"
          cosign verify-blob \
            --bundle source-artifacts/release-manifest.sigstore.json \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            source-artifacts/release-manifest.json
          cosign verify-blob \
            --bundle source-artifacts/runtime-image-evidence.sigstore.json \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            source-artifacts/runtime-image-evidence.json
          test "$(jq -r .release.version source-artifacts/release-manifest.json)" = "$IMAGE_TAG"
          test "$(jq -r .release.source_commit source-artifacts/release-manifest.json)" = "$TAG_COMMIT"
          test "$(jq -r .astronomer.chart.reference source-artifacts/release-manifest.json)" = "$(cat source-artifacts/chart.digest)"
          test "$(jq -r .result source-artifacts/runtime-image-evidence.json)" = passed
          test "$(jq -r .release_version source-artifacts/runtime-image-evidence.json)" = "$IMAGE_TAG"
          test "$(jq -r .release_manifest_sha256 source-artifacts/runtime-image-evidence.json)" = "sha256:$(sha256sum source-artifacts/release-manifest.json | awk '{print $1}')"
          for subject_file in astronomer-flux-distribution.digest astronomer-platform-bundles.digest release-manifest.digest; do
            subject="$(cat "source-artifacts/${subject_file}")"
            [[ "$subject" =~ @sha256:[a-f0-9]{64}$ ]]
            cosign verify \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$subject" >/dev/null
          done

      - name: Verify original delivery signatures before metadata recovery
        if: steps.identity.outputs.metadata_required == 'true'
        env:
          IMAGE_TAG: ${{ steps.identity.outputs.image_tag }}
        run: |
          set -euo pipefail
          for name in astronomer-flux-distribution astronomer-platform-bundles; do
            subject="$(cat "source-artifacts/${name}.digest")"
            [[ "$subject" =~ ^ghcr\.io/alphabravo-oss/${name}@sha256:[a-f0-9]{64}$ ]]
            cosign verify --certificate-identity "https://github.com/alphabravo-oss/astronomer/.github/workflows/release.yaml@refs/tags/${IMAGE_TAG}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$subject" >/dev/null
          done

  complete-metadata:
    name: complete missing metadata from immutable tagged source
    needs: preflight
    if: needs.preflight.outputs.metadata-required == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      artifact-metadata: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Checkout runtime qualification tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: qualification-tools
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.16.2

      - name: Check build capacity
        run: ./scripts/check-build-capacity.sh --path .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: "v2.5.3"

      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          syft-version: "v1.16.0"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Install pinned ORAS
        run: go install oras.land/oras/cmd/oras@v1.2.2

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download exact image identities
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          pattern: sbom-*-${{ needs.preflight.outputs.image-tag }}
          path: release-images
          merge-multiple: true

      - name: Download delivery artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          name: delivery-artifacts-${{ needs.preflight.outputs.image-tag }}
          path: release-delivery

      - name: Lint dependency-free management chart
        run: |
          test -z "$(find deploy/chart/charts -mindepth 1 -maxdepth 1 -type f -print -quit 2>/dev/null)"
          test "$(helm dependency list deploy/chart 2>/dev/null | awk 'NR > 1 && NF {count++} END {print count+0}')" -eq 0
          openssl rand -base64 48 > /tmp/release-lint-jwt-key
          openssl rand -base64 32 | tr '+/' '-_' > /tmp/release-lint-encryption-key
          helm lint deploy/chart \
            -f deploy/chart/values-dev.yaml \
            --set-file secrets.secretKey=/tmp/release-lint-jwt-key \
            --set-file secrets.encryptionKey=/tmp/release-lint-encryption-key

      - name: Resolve every tagged runtime image
        run: ./scripts/resolve-release-images.py --inventory deploy/chart/images.txt --output resolved-images.json

      - name: Package, push, sign, and attest exact chart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          IMAGE_TAG: ${{ needs.preflight.outputs.image-tag }}
          CHART_VERSION: ${{ needs.preflight.outputs.chart-version }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | helm registry login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          echo "$GHCR_TOKEN" | oras login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          helm package deploy/chart --version "$CHART_VERSION"
          chart_digest=""
          if helm show chart "oci://ghcr.io/alphabravo-oss/charts/astronomer" --version "$CHART_VERSION" >/dev/null 2>&1; then
            chart_digest="$(oras resolve "ghcr.io/alphabravo-oss/charts/astronomer:${CHART_VERSION}")"
            mkdir -p existing-chart packaged-chart published-chart
            helm pull "oci://ghcr.io/alphabravo-oss/charts/astronomer" --version "$CHART_VERSION" --destination existing-chart
            tar -xzf "astronomer-${CHART_VERSION}.tgz" -C packaged-chart
            tar -xzf "existing-chart/astronomer-${CHART_VERSION}.tgz" -C published-chart
            diff --no-dereference --recursive --brief packaged-chart published-chart || {
              echo "refusing to reuse astronomer:${CHART_VERSION}: published chart contents differ from this commit" >&2
              exit 1
            }
            cp "existing-chart/astronomer-${CHART_VERSION}.tgz" "astronomer-${CHART_VERSION}.tgz"
            echo "reusing already-published immutable chart astronomer:${CHART_VERSION}@${chart_digest}"
          else
            helm push "astronomer-${CHART_VERSION}.tgz" "oci://ghcr.io/alphabravo-oss/charts" 2>&1 | tee chart-push.log
            chart_digest="$(awk '$1 == "Digest:" {digest=$2} END {print digest}' chart-push.log)"
          fi
          [[ "$chart_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          chart_ref="ghcr.io/alphabravo-oss/charts/astronomer@${chart_digest}"
          cosign sign --yes "$chart_ref"
          syft "file:astronomer-${CHART_VERSION}.tgz" -o spdx-json > sbom-chart.spdx.json
          cosign attest --yes --predicate sbom-chart.spdx.json --type spdxjson "$chart_ref"
          jq -n \
            --arg source "https://github.com/${{ github.repository }}@${{ needs.preflight.outputs.tag-commit }}" \
            --arg workflow "https://github.com/${{ github.workflow_ref }}" \
            '{builder:{id:$workflow},buildType:"https://astronomer.io/build-types/helm-chart-v1",invocation:{configSource:{uri:$source}}}' \
            > provenance-chart.slsa.json
          cosign attest --yes --predicate provenance-chart.slsa.json --type slsaprovenance "$chart_ref"
          printf '%s\n' "$chart_ref" > chart.digest

      - name: Verify the qualified Charlie artifact
        env:
          GH_TOKEN: ${{ secrets.CHARLIE_GH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}"
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          version="${CHARLIE_QUALIFIED_VERSION#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release download "$CHARLIE_QUALIFIED_VERSION" \
            --repo AlphaBravoCompany/charlie \
            --dir "$work" \
            --pattern "charlie-release-${version}.json" \
            --pattern "charlie-release-${version}.json.signature.sigstore.json"
          cosign verify-blob --new-bundle-format \
            --bundle "$work/charlie-release-${version}.json.signature.sigstore.json" \
            --certificate-identity "$CHARLIE_CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$CHARLIE_CERTIFICATE_OIDC_ISSUER" \
            "$work/charlie-release-${version}.json" >/dev/null
          python3 - "$work/charlie-release-${version}.json" "$CHARLIE_ARTIFACT_REFERENCE" <<'PY'
          import json, sys
          release = json.load(open(sys.argv[1], encoding="utf-8"))
          expected = sys.argv[2]
          image = release["artifacts"]["central_image"]
          got = image["name"] + "@" + image["digest"]
          if got != expected:
              raise SystemExit(f"signed Charlie release binds {got}, not {expected}")
          print(f"verified signed Charlie {release['tag']} {got}")
          PY
          archive="$(jq -er '.artifacts.central_image.oci_layout' "$work/charlie-release-${version}.json")"
          test "$archive" = "charlie-central-${version}-oci-layout.tar.gz"
          gh release download "$CHARLIE_QUALIFIED_VERSION" --repo AlphaBravoCompany/charlie --dir "$work" \
            --pattern "$archive" --pattern "${archive}.signature.sigstore.json"
          cosign verify-blob --new-bundle-format --bundle "$work/${archive}.signature.sigstore.json" \
            --certificate-identity "$CHARLIE_CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$CHARLIE_CERTIFICATE_OIDC_ISSUER" "$work/$archive" >/dev/null
          mkdir "$RUNNER_TEMP/charlie-oci"
          python3 - "$work/$archive" "$RUNNER_TEMP/charlie-oci" <<'PYOCI'
          import sys, tarfile
          with tarfile.open(sys.argv[1]) as archive:
              archive.extractall(sys.argv[2], filter="data")
          PYOCI

      - name: Generate and sign the single release manifest
        env:
          IMAGE_TAG: ${{ needs.preflight.outputs.image-tag }}
        run: |
          set -euo pipefail
          source_epoch="$(git show -s --format=%ct '${{ needs.preflight.outputs.tag-commit }}')"
          ./scripts/generate-release-manifest.py \
            --version "$IMAGE_TAG" \
            --source-commit "${{ needs.preflight.outputs.tag-commit }}" \
            --source-date-epoch "$source_epoch" \
            --chart-reference "$(cat chart.digest)" \
            --chart-package "astronomer-${{ needs.preflight.outputs.chart-version }}.tgz" \
            --image-digest-dir release-images \
            --resolved-images resolved-images.json \
            --flux-reference "$(cat release-delivery/astronomer-flux-distribution.digest)" \
            --flux-archive release-delivery/flux-distribution.tar.gz \
            --bundles-reference "$(cat release-delivery/astronomer-platform-bundles.digest)" \
            --bundles-archive release-delivery/builtin-bundles.tar.gz \
            --charlie-version "$CHARLIE_QUALIFIED_VERSION" \
            --charlie-reference "$CHARLIE_ARTIFACT_REFERENCE" \
            --charlie-capability-digest "$CHARLIE_CAPABILITY_DISCLOSURE_DIGEST" \
            --charlie-certificate-identity "$CHARLIE_CERTIFICATE_IDENTITY" \
            --charlie-certificate-oidc-issuer "$CHARLIE_CERTIFICATE_OIDC_ISSUER" \
            --output release-manifest.json
          cosign sign-blob --yes --bundle release-manifest.sigstore.json release-manifest.json
          manifest_tag="ghcr.io/alphabravo-oss/astronomer-release-manifest:${IMAGE_TAG}"
          if manifest_digest="$(oras resolve "$manifest_tag" 2>/dev/null)"; then
            mkdir existing-manifest
            oras pull "${manifest_tag%:*}@${manifest_digest}" -o existing-manifest
            cmp release-manifest.json existing-manifest/release-manifest.json
          else
            oras push --format json "$manifest_tag" \
              --artifact-type application/vnd.astronomer.release-manifest.v1+json \
              release-manifest.json:application/vnd.astronomer.release-manifest.v1+json > release-manifest.push.json
            manifest_digest="$(jq -er '.digest | select(test("^sha256:[a-f0-9]{64}$"))' release-manifest.push.json)"
          fi
          [[ "$manifest_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          manifest_ref="ghcr.io/alphabravo-oss/astronomer-release-manifest@${manifest_digest}"
          cosign sign --yes "$manifest_ref"
          printf '%s\n' "$manifest_ref" > release-manifest.digest
          cp deploy/chart/values-production.yaml values-production.yaml

      - name: Install checksum-verified Trivy
        env:
          TRIVY_VERSION: 0.75.0
        run: |
          set -euo pipefail
          curl -fsSLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz$" "trivy_${TRIVY_VERSION}_checksums.txt" | sha256sum --check
          tar -xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy

      - name: Qualify every transitive runtime image
        run: |
          set -euo pipefail
          python3 qualification-tools/scripts/qualify-release-runtime-images.py \
            --manifest release-manifest.json \
            --waivers deploy/release/runtime-image-waivers.json \
            --license-policy deploy/release/license-policy.json \
            --work-dir runtime-image-evidence \
            --charlie-oci-layout "$RUNNER_TEMP/charlie-oci" \
            --output runtime-image-evidence.json
          cp deploy/release/runtime-image-waivers.json runtime-image-evidence/waivers.json
          cosign sign-blob --yes --bundle runtime-image-evidence.sigstore.json runtime-image-evidence.json
          tar -czf runtime-image-evidence.tar.gz runtime-image-evidence/

      - name: Bind recovered metadata to the interrupted release
        env:
          SOURCE_COMMIT: ${{ needs.preflight.outputs.tag-commit }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          PRODUCER_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PYPROOF'
          import hashlib, json, os
          from pathlib import Path
          names = ("release-manifest.json", "runtime-image-evidence.json", "runtime-image-evidence.tar.gz", "astronomer-1.2.0.tgz")
          record = {"schema_version": 1, "tag": "v1.2.0", "source_commit": os.environ["SOURCE_COMMIT"],
                    "source_run_id": os.environ["SOURCE_RUN_ID"], "producer_run_id": os.environ["GITHUB_RUN_ID"],
                    "producer_commit": os.environ["PRODUCER_COMMIT"],
                    "files": {name: "sha256:" + hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in names}}
          Path("release-recovery.json").write_text(json.dumps(record, indent=2) + "\n")
          PYPROOF
          cosign sign-blob --yes --bundle release-recovery.sigstore.json release-recovery.json

      - name: Attest packaged chart file
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: astronomer-${{ needs.preflight.outputs.chart-version }}.tgz

      - name: Upload complete signed release unit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chart-${{ needs.preflight.outputs.image-tag }}
          path: |
            astronomer-${{ needs.preflight.outputs.chart-version }}.tgz
            chart.digest
            sbom-chart.spdx.json
            provenance-chart.slsa.json
            release-manifest.json
            release-manifest.sigstore.json
            release-manifest.digest
            runtime-image-evidence.json
            runtime-image-evidence.sigstore.json
            runtime-image-evidence.tar.gz
            resolved-images.json
            release-recovery.json
            release-recovery.sigstore.json
            values-production.yaml
          retention-days: 90

  qualify:
    name: install exact release on a clean cluster · Kubernetes ${{ matrix.kubernetes_minor }}
    needs: [preflight, complete-metadata]
    if: always() && !cancelled() && needs.preflight.result == 'success' && (needs.complete-metadata.result == 'success' || needs.complete-metadata.result == 'skipped')
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - kubernetes_minor: "1.33"
            k3s_image: rancher/k3s:v1.33.5-k3s1
          - kubernetes_minor: "1.34"
            k3s_image: rancher/k3s:v1.34.1-k3s1
          - kubernetes_minor: "1.35"
            k3s_image: rancher/k3s:v1.35.0-k3s1
    steps:
      - name: Checkout tagged configuration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Checkout recovery verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: recovery-tools
          persist-credentials: false

      - name: Install checksum-verified k3d
        env:
          K3D_VERSION: v5.8.3
        run: |
          curl -fsSLO "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
          curl -fsSLO "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/checksums.txt"
          awk '$2 == "_dist/k3d-linux-amd64" { print $1 "  k3d-linux-amd64" }' checksums.txt \
            | sha256sum --check
          sudo install -m 0755 k3d-linux-amd64 /usr/local/bin/k3d

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.16.2

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: "v2.4.1"

      - name: Download original image identities
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          pattern: sbom-*-${{ needs.preflight.outputs.image-tag }}
          path: release-images
          merge-multiple: true

      - name: Download signed release manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: ${{ needs.preflight.outputs.metadata-run-id }}
          github-token: ${{ github.token }}
          name: chart-${{ needs.preflight.outputs.image-tag }}
          path: release-unit

      - name: Verify signed release metadata and chart
        env:
          IMAGE_TAG: ${{ needs.preflight.outputs.image-tag }}
          SOURCE_COMMIT: ${{ needs.preflight.outputs.tag-commit }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          python3 recovery-tools/scripts/verify-release-metadata.py --directory release-unit --tag "$IMAGE_TAG" \
            --source-commit "$SOURCE_COMMIT" --source-run-id "$SOURCE_RUN_ID" --subject chart

      - name: Load immutable image references
        run: |
          set -euo pipefail
          for pair in \
            SERVER:server:astronomer-go-server \
            WORKER:worker:astronomer-go-worker \
            AGENT:agent:astronomer-go-agent \
            MIGRATE:migrate:astronomer-go-migrate \
            FRONTEND:frontend:astronomer-frontend \
            SHELL:shell:astronomer-shell \
            DR:dr:astronomer-dr; do
            key="${pair%%:*}"
            rest="${pair#*:}"
            component="${rest%%:*}"
            repository="${rest#*:}"
            ref="$(cat "release-images/${component}.digest")"
            [[ "$ref" =~ ^ghcr\.io/alphabravo-oss/${repository}@sha256:[a-f0-9]{64}$ ]]
            echo "${key}_REF=${ref}" >> "$GITHUB_ENV"
            echo "${key}_DIGEST=${ref#*@}" >> "$GITHUB_ENV"
          done
          while IFS='|' read -r key source; do
            digest="$(jq -er --arg source "$source" \
              '.astronomer.runtime_images[] | select(.source_reference == $source) | .reference | split("@")[1]' \
              release-unit/release-manifest.json)"
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            echo "${key}_DIGEST=${digest}" >> "$GITHUB_ENV"
          done <<'EOF'
          BUSYBOX|busybox:1.36
          POSTGRES|postgres:16-alpine
          REDIS|valkey/valkey:8-alpine
          DEX|dexidp/dex:v2.45.1
          LOGGING|fluent/fluent-bit:5.1.3
          EOF

      - name: Create clean Kubernetes and install Gateway prerequisites
        env:
          K3S_IMAGE: ${{ matrix.k3s_image }}
        run: |
          k3d cluster create astronomer-release \
            --image "$K3S_IMAGE" \
            --port '8080:80@loadbalancer' \
            --k3s-arg '--disable=traefik@server:*' \
            --wait
          kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.5.1/standard-install.yaml
          helm upgrade --install ngf oci://ghcr.io/nginx/charts/nginx-gateway-fabric \
            --version 2.6.0 --namespace nginx-gateway --create-namespace \
            --wait --timeout 5m
          source scripts/lib/gatewayclass-readiness.sh
          wait_for_gatewayclass nginx 30 2

      - name: Install the published OCI chart as a new user would
        env:
          IMAGE_TAG: ${{ needs.preflight.outputs.image-tag }}
          CHART_VERSION: ${{ needs.preflight.outputs.chart-version }}
        run: |
          helm upgrade --install astronomer \
            oci://ghcr.io/alphabravo-oss/charts/astronomer \
            --version "$CHART_VERSION" \
            --namespace astronomer --create-namespace \
            -f deploy/chart/values-k3d.yaml \
            --set-string image.server.tag="$IMAGE_TAG" \
            --set-string image.worker.tag="$IMAGE_TAG" \
            --set-string image.agent.tag="$IMAGE_TAG" \
            --set-string image.migrate.tag="$IMAGE_TAG" \
            --set-string frontend.image.tag="$IMAGE_TAG" \
            --set-string preflight.image.tag="$IMAGE_TAG" \
            --set-string image.server.digest="$SERVER_DIGEST" \
            --set-string image.worker.digest="$WORKER_DIGEST" \
            --set-string image.agent.digest="$AGENT_DIGEST" \
            --set-string image.migrate.digest="$MIGRATE_DIGEST" \
            --set-string frontend.image.digest="$FRONTEND_DIGEST" \
            --set-string preflight.image.digest="$SHELL_DIGEST" \
            --set-string utilities.busybox.digest="$BUSYBOX_DIGEST" \
            --set-string postgres.image.digest="$POSTGRES_DIGEST" \
            --set-string redis.image.digest="$REDIS_DIGEST" \
            --set-string dex.image.digest="$DEX_DIGEST" \
            --set-string managementBackup.image.digest="$DR_DIGEST" \
            --set-string managementRestoreDrill.image.digest="$DR_DIGEST" \
            --set-string managementRestoreDrill.sidecar.image.digest="$POSTGRES_DIGEST" \
            --set-string managementLogging.image.digest="$LOGGING_DIGEST" \
            --set-string config.agentImageRepository="$AGENT_REF" \
            --set-string config.agentImageTag="$IMAGE_TAG" \
            --set-string kubectlShell.image="$SHELL_REF" \
            --set-file release.manifest=release-unit/release-manifest.json \
            --atomic --cleanup-on-fail --timeout 15m

      - name: Verify health and exact first-party image identities
        env:
          IMAGE_TAG: ${{ needs.preflight.outputs.image-tag }}
        run: |
          helm get manifest astronomer --namespace astronomer > /tmp/release-manifest.yaml
          for key in SERVER WORKER MIGRATE FRONTEND SHELL; do
            ref_var="${key}_REF"
            grep -q "${!ref_var}" /tmp/release-manifest.yaml
          done
          grep -q "AGENT_IMAGE_REPOSITORY: \"${AGENT_REF}\"" /tmp/release-manifest.yaml
          grep -q "AGENT_IMAGE_TAG: \"${IMAGE_TAG}\"" /tmp/release-manifest.yaml
          grep -q 'RELEASE_MANIFEST_PATH' /tmp/release-manifest.yaml
          ! awk '$1 == "image:" {print $2}' /tmp/release-manifest.yaml | grep -Ev '@sha256:[a-f0-9]{64}$'
          for attempt in $(seq 1 90); do
            if curl -fsS -H 'Host: astronomer.localtest.me' http://127.0.0.1:8080/readyz; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Dump failed qualification state
        if: failure()
        run: |
          helm status astronomer --namespace astronomer || true
          kubectl get pods,deploy,statefulset,job -A -o wide || true
          kubectl get gatewayclass,gateway,httproute -A -o yaml || true
          kubectl logs --namespace astronomer --all-containers --tail=300 \
            -l app.kubernetes.io/instance=astronomer || true

  rc-rehearsal:
    name: qualify v1.2.0 upgrade, backup and clean restore
    if: needs.preflight.outputs.image-tag == 'v1.2.0'
    needs: [preflight, qualify]
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with: {version: v3.16.2}
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with: {cosign-release: v2.5.3}
      - name: Install checksum-verified k3d
        env: {K3D_VERSION: v5.8.3}
        run: |
          curl -fsSLO "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
          curl -fsSLO "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/checksums.txt"
          grep ' _dist/k3d-linux-amd64$' checksums.txt | sed 's#_dist/##' | sha256sum --check
          sudo install -m 0755 k3d-linux-amd64 /usr/local/bin/k3d
          sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Rehearse exact owned disposable RC
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RC_DISPOSABLE_ACK: destroy-astronomer-rc-${{ github.run_id }}
          RC_METADATA_RUN_ID: ${{ needs.preflight.outputs.metadata-run-id }}
          RC_EVIDENCE_OUTPUT: rc-rehearsal-evidence.json
        run: ./scripts/rehearse-release-candidate.sh "${{ needs.preflight.outputs.image-tag }}" "${{ inputs.source_run_id }}" "v1.1.0"
      - name: Sign sanitized RC evidence
        run: cosign sign-blob --yes --bundle rc-rehearsal-evidence.sigstore.json rc-rehearsal-evidence.json
      - name: Retain sanitized RC evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rc-rehearsal-${{ github.run_id }}
          path: |
            rc-rehearsal-evidence.json
            rc-rehearsal-evidence.sigstore.json
          if-no-files-found: error
          retention-days: 90

  promote:
    name: publish recovered immutable GitHub Release
    needs: [preflight, qualify, rc-rehearsal]
    if: >-
      always() && !cancelled() && needs.preflight.result == 'success' && needs.qualify.result == 'success' &&
      ((needs.preflight.outputs.image-tag == 'v1.2.0' && needs.rc-rehearsal.result == 'success') ||
       (needs.preflight.outputs.image-tag != 'v1.2.0' && needs.rc-rehearsal.result == 'skipped'))
    runs-on: ubuntu-latest
    environment: release-production
    permissions:
      actions: read
      contents: write
      packages: read
    steps:
      - name: Checkout tagged configuration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download original release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          pattern: '*-${{ needs.preflight.outputs.image-tag }}'
          merge-multiple: true

      - name: Download completed metadata
        if: needs.preflight.outputs.metadata-required == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: chart-${{ needs.preflight.outputs.image-tag }}

      - name: Install cosign verifier for protected qualifications
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with: {cosign-release: v2.5.3}

      - name: Download current-run v1.2.0 rehearsal evidence
        if: needs.preflight.outputs.image-tag == 'v1.2.0'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rc-rehearsal-${{ github.run_id }}

      - name: Verify automated v1.2.0 publication evidence
        if: needs.preflight.outputs.image-tag == 'v1.2.0'
        env:
          TAG: ${{ needs.preflight.outputs.image-tag }}
          SOURCE_COMMIT: ${{ needs.preflight.outputs.tag-commit }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          PRODUCER_RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          RC_IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          python3 scripts/validate-automated-release.py --tag "$TAG" --source-commit "$SOURCE_COMMIT" \
            --source-run-id "$SOURCE_RUN_ID" --producer-run-id "$PRODUCER_RUN_ID" \
            --repository "$REPOSITORY" --rc-identity "$RC_IDENTITY"

      - name: Verify protected release approval and external accessibility evidence
        if: needs.preflight.outputs.image-tag != 'v1.2.0'
        env:
          RELEASE_APPROVAL_JSON: ${{ vars.RELEASE_APPROVAL_JSON }}
          TAG: ${{ needs.preflight.outputs.image-tag }}
          SOURCE_COMMIT: ${{ needs.preflight.outputs.tag-commit }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RUNTIME_IMAGE_EVIDENCE: runtime-image-evidence.json
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_APPROVAL_JSON"
          umask 077
          printf '%s' "$RELEASE_APPROVAL_JSON" > "$RUNNER_TEMP/release-approval.json"
          python3 scripts/fetch-release-qualification-artifacts.py --approval "$RUNNER_TEMP/release-approval.json" --out "$RUNNER_TEMP/release-qualifications" --repository "$REPOSITORY" --source-commit "$SOURCE_COMMIT" --tag "$TAG"
          q="$RUNNER_TEMP/release-qualifications"
          python3 scripts/validate-release-approval.py "$RUNNER_TEMP/release-approval.json" \
            --tag "$TAG" --source-commit "$SOURCE_COMMIT" --source-run-id "$SOURCE_RUN_ID" --repository "$REPOSITORY" \
            --runtime-image-evidence "$RUNTIME_IMAGE_EVIDENCE" --runtime-image-bundle runtime-image-evidence.sigstore.json \
            --rc-evidence "$q/rc_rehearsal/rc-rehearsal-evidence.json" --rc-bundle "$q/rc_rehearsal/rc-rehearsal-evidence.sigstore.json" \
            --cloud-evidence "$q/cloud_acceptance/cloud-acceptance.json" --cloud-bundle "$q/cloud_acceptance/cloud-acceptance.json.sigstore.json" \
            --scale-evidence "$q/scale_certification/certification-set.json" --scale-bundle "$q/scale_certification/certification-set.sigstore.json" \
            --rancher-evidence "$q/rancher_benchmark/benchmark-v1.json" --rancher-bundle "$q/rancher_benchmark/benchmark-v1.sigstore.json" \
            --accessibility-evidence "$q/accessibility/accessibility-evidence.json" --accessibility-bundle "$q/accessibility/accessibility-evidence.sigstore.json"

      - name: Verify downloaded artifact set
        env:
          IMAGE_TAG: ${{ needs.preflight.outputs.image-tag }}
          CHART_VERSION: ${{ needs.preflight.outputs.chart-version }}
        run: |
          set -euo pipefail
          test -f "astronomer-${CHART_VERSION}.tgz"
          test -s release-manifest.json
          test -s release-manifest.sigstore.json
          test -s runtime-image-evidence.json
          test -s runtime-image-evidence.sigstore.json
          test -s runtime-image-evidence.tar.gz
          test -s values-production.yaml
          for component in server worker agent migrate shell dr frontend; do
            test -s "sbom-${component}.spdx.json"
            jq -e . "sbom-${component}.spdx.json" >/dev/null
            test -s "${component}.digest"
            grep -Eq "^ghcr.io/alphabravo-oss/[^@]+@sha256:[0-9a-f]{64}$" "${component}.digest"
          done
          test -s flux-distribution.tar.gz
          test -s builtin-bundles.tar.gz

      - name: Pack OSS air-gap kit
        env:
          TAG: ${{ needs.preflight.outputs.image-tag }}
          CHART_VERSION: ${{ needs.preflight.outputs.chart-version }}
        run: |
          set -euo pipefail
          python3 scripts/airgap-kit.py list-images --manifest release-manifest.json > astronomer-images.txt
          awk '/@sha256:[a-f0-9]{64}$/ { n++ } END { exit (n >= 6) ? 0 : 1 }' astronomer-images.txt
          python3 scripts/airgap-kit.py pack \
            --manifest release-manifest.json \
            --chart "astronomer-${CHART_VERSION}.tgz" \
            --values values-production.yaml \
            --signature release-manifest.sigstore.json \
            --flux-archive flux-distribution.tar.gz \
            --bundles-archive builtin-bundles.tar.gz \
            --output "astronomer-airgap-${TAG}.tar.gz"
          tar -tzf "astronomer-airgap-${TAG}.tar.gz" | grep -F "astronomer-airgap-${TAG}/astronomer-save-images.sh"

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.preflight.outputs.image-tag }}
        run: |
          git show "refs/tags/$TAG:CHANGELOG.md" | awk '/^## Unreleased/{emit=1; next} /^## /{if (emit) exit} emit' > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md
          if [[ -f release-recovery.json ]]; then
            producer_commit="$(jq -er .producer_commit release-recovery.json)"
            printf '\nRelease metadata was completed by the signed recovery workflow. Application images and delivery bundles retain their original tagged source and signatures. For upgrades use operator tools from https://github.com/alphabravo-oss/astronomer/tree/%s/scripts (including upgrade-release.sh and verify-release-metadata.py), or the included air-gap kit. See release-recovery.json for the exact source and producer identities.\n' "$producer_commit" >> RELEASE_NOTES.md
          fi
          sort --unique ./*.digest > RELEASE_SUBJECTS
          jq -r '.astronomer.images[].reference' release-manifest.json | sort --unique > RELEASE_IMAGES
          find . -maxdepth 1 -type f \( \
              -name 'astronomer-*.tgz' -o -name '*.tar.gz' -o \
              -name 'sbom-*.spdx.json' -o -name 'provenance-*.slsa.json' -o \
              -name 'release-manifest.json' -o -name 'release-manifest.sigstore.json' -o \
              -name 'runtime-image-evidence.json' -o -name 'runtime-image-evidence.sigstore.json' -o \
              -name 'release-recovery*.json' -o -name 'RELEASE_NOTES.md' -o \
              -name 'rc-rehearsal-evidence*.json' -o -name 'release-qualification.json' -o \
              -name 'values-production.yaml' -o \
              -name 'astronomer-images.txt' -o \
              -name 'RELEASE_IMAGES' -o -name 'RELEASE_SUBJECTS' \
            \) -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS
          qualification_assets=()
          if [[ "$TAG" == v1.2.0 ]]; then
            qualification_assets=(rc-rehearsal-evidence.json rc-rehearsal-evidence.sigstore.json release-qualification.json)
          fi
          if [[ -f release-recovery.json ]]; then
            qualification_assets+=(release-recovery.json release-recovery.sigstore.json)
          fi
          gh release create "$TAG" "${qualification_assets[@]}" \
            --repo "$REPOSITORY" \
            --verify-tag \
            --notes-file RELEASE_NOTES.md \
            --title "Astronomer ${TAG}" \
            astronomer-*.tgz *.tar.gz sbom-*.spdx.json provenance-*.slsa.json \
            release-manifest.json release-manifest.sigstore.json \
            runtime-image-evidence.json runtime-image-evidence.sigstore.json \
            values-production.yaml astronomer-images.txt RELEASE_NOTES.md \
            RELEASE_IMAGES RELEASE_SUBJECTS SHA256SUMS
