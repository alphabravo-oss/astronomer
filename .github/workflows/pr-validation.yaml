name: pr-validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offering-qualification-static:
    name: offering qualification static gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Reject incomplete inventory and false-green evidence
        run: |
          go test ./scripts/qualify-offerings -count=1
          python3 scripts/tests/offering_qualification_test.py

  backend:
    name: enterprise backend gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Backend contract checks consume js-yaml from the locked frontend tree.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.11.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install contract dependencies
        id: install-contract-dependencies
        working-directory: frontend
        run: npm install --global npm@12.2.0 && npm ci

      - name: Verify offline toolchain authority and resolver contracts
        run: make versions-check

      - name: Install ShellCheck and ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep shellcheck

      - name: Migration roundtrip smoke (TEST-05)
        run: |
          set +e
          ./scripts/migrate-roundtrip-smoke.sh > /tmp/astronomer-migration-roundtrip.log 2>&1
          migration_status=$?
          set -e
          cat /tmp/astronomer-migration-roundtrip.log
          exit "$migration_status"
        env:
          # Job uses service container when present; script also self-starts docker PG.
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Preserve migration setup and roundtrip diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: migration-roundtrip-evidence-${{ github.sha }}
          path: /tmp/astronomer-migration-roundtrip.log
          if-no-files-found: error
          retention-days: 90

      - name: Supported release-line upgrade matrix
        run: ./scripts/release-upgrade-matrix.sh

      - name: Run authoritative backend gate
        run: ./scripts/verify-enterprise.sh backend
        env:
          VERIFY_ARTIFACT_DIR: /tmp/astronomer-verify-enterprise-backend

      - name: Upload commit-bound backend evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: enterprise-backend-evidence-${{ github.sha }}
          path: /tmp/astronomer-verify-enterprise-backend
          if-no-files-found: error
          retention-days: 90

  stateful-qualifications:
    name: stateful · PG${{ matrix.postgres-major }} · ${{ matrix.qualification }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        postgres-major: ["18", "17"]
        exclude:
          - postgres-major: "17"
            qualification: tunnel-owner-ha
        qualification:
          - postgres-integrations
          - postgres-integrations-race
          - worker-runtime
          - worker-runtime-race
          - process-restart
          - process-restart-race
          - redis-outage
          - redis-outage-race
          - postgres-outage
          - postgres-outage-race
          - tunnel-owner-ha
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install pinned structured Go test runner
        run: ./scripts/build-gotestsum.sh "$RUNNER_TEMP/gotestsum"

      - name: Run qualification without hidden skips
        env:
          QUALIFICATION: ${{ matrix.qualification }}
          POSTGRES_QUALIFICATION_MAJOR: ${{ matrix.postgres-major }}
          QUALIFICATION_ARTIFACT_DIR: stateful-evidence/structured
        run: |
          export GOTESTSUM="$RUNNER_TEMP/gotestsum"
          case "$QUALIFICATION" in
            postgres-integrations) qualification_command='make test-postgres-integration' ;;
            postgres-integrations-race) qualification_command='POSTGRES_INTEGRATION_RACE=1 make test-postgres-integration' ;;
            worker-runtime) qualification_command='make test-worker-runtime-integration' ;;
            worker-runtime-race) qualification_command='WORKER_INTEGRATION_RACE=1 make test-worker-runtime-integration' ;;
            process-restart) qualification_command='make test-process-restart-qualification' ;;
            process-restart-race) qualification_command='PROCESS_RESTART_QUALIFICATION_RACE=1 make test-process-restart-qualification' ;;
            redis-outage) qualification_command='make test-redis-outage-recovery' ;;
            redis-outage-race) qualification_command='REDIS_OUTAGE_RECOVERY_RACE=1 make test-redis-outage-recovery' ;;
            postgres-outage) qualification_command='make test-postgres-outage-qualification' ;;
            postgres-outage-race) qualification_command='POSTGRES_OUTAGE_QUALIFICATION_RACE=1 make test-postgres-outage-qualification' ;;
            tunnel-owner-ha) qualification_command='./scripts/test-tunnel-queue-ha.sh' ;;
            *) echo "unknown stateful qualification: $QUALIFICATION" >&2; exit 2 ;;
          esac
          mkdir -p stateful-evidence
          set -o pipefail
          bash -Eeuo pipefail -c "$qualification_command" 2>&1 | tee "stateful-evidence/${QUALIFICATION}.log"
      - name: Retain stateful qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stateful-pg${{ matrix.postgres-major }}-${{ matrix.qualification }}-${{ github.run_id }}
          path: stateful-evidence/
          if-no-files-found: error
          retention-days: 90

  postgres-failover-certification:
    name: PostgreSQL failover RPO/RTO certification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Validate failover harness contract
        run: make test-postgres-failover-static

      - name: Certify PostgreSQL streaming failover
        run: make test-postgres-failover-certification
        env:
          POSTGRES_FAILOVER_ARTIFACT_DIR: /tmp/astronomer-postgres-failover
          POSTGRES_FAILOVER_RPO_MAX_ROWS: "0"
          POSTGRES_FAILOVER_RTO_MAX_SECONDS: "30"

      - name: Upload PostgreSQL failover evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: postgres-failover-evidence-${{ github.run_id }}
          path: /tmp/astronomer-postgres-failover/
          if-no-files-found: error
          retention-days: 90

  frontend:
    name: enterprise frontend gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.11.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        id: install-dependencies
        working-directory: frontend
        run: npm install --global npm@12.2.0 && npm ci

      - name: Run authoritative frontend gate
        run: ./scripts/verify-enterprise.sh frontend
        env:
          # Preserve the existing moderate threshold, which is stricter than
          # the enterprise high/critical minimum.
          NPM_AUDIT_LEVEL: moderate
          VERIFY_ARTIFACT_DIR: /tmp/astronomer-verify-enterprise-frontend

      - name: Upload commit-bound frontend evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: enterprise-frontend-evidence-${{ github.sha }}
          path: /tmp/astronomer-verify-enterprise-frontend
          if-no-files-found: error
          retention-days: 90

  frontend-e2e:
    name: Playwright end-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.11.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --global npm@12.2.0 && npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Validate flake ownership and quarantine expiry
        run: node ../scripts/test-flake-report.mjs --validate

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Route-smoke crawl
        run: npm run test:e2e:smoke
        env:
          # P7.3: the crawl also writes one full-page screenshot per route to
          # frontend/gallery/ for the reviewer eyeball (non-blocking).
          SMOKE_GALLERY: "1"

      - name: Blocking desktop, tablet, and mobile visual matrix
        run: npm run test:e2e:visual

      - name: Upload screenshot gallery
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-gallery
          path: frontend/gallery/
          retention-days: 14

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 30

  # P7.2 live e2e tier: the live specs run through the same disposable,
  # fail-fast process harness available to developers via make.
  frontend-e2e-live:
    name: frontend live e2e · ${{ matrix.engine }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.11.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install --global npm@12.2.0 && npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Install checksum-verified k3d
        env:
          K3D_VERSION: v5.9.0
        run: |
          curl -fsSLO "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
          curl -fsSLO "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/checksums.txt"
          awk '$2 == "_dist/k3d-linux-amd64" { print $1 "  k3d-linux-amd64" }' checksums.txt \
            | sha256sum --check
          sudo install -m 0755 k3d-linux-amd64 /usr/local/bin/k3d

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.0

      - name: Validate live-browser harness contract
        run: make test-live-browser-static

      - name: Disposable live end-to-end stack
        run: ./scripts/test-live-browser.sh
        env:
          # The fixture directory is bind-mounted into host-Docker containers.
          # Keep it below the checked-out workspace so Local CI can translate
          # the runner path to its Docker-host path without weakening isolation.
          LIVE_BROWSER_ARTIFACT_DIR: test-artifacts/astronomer-live-browser
          LIVE_BROWSER_TRIVY_ENABLED: "1"
          LIVE_BROWSER_ENGINE: ${{ matrix.engine }}

      - name: Upload live browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-browser-evidence-${{ matrix.engine }}-${{ github.run_id }}
          path: test-artifacts/astronomer-live-browser/
          if-no-files-found: error
          retention-days: 90

  helm:
    name: enterprise Helm gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.0

      - name: Run authoritative Helm gate
        run: ./scripts/verify-enterprise.sh helm
        env:
          VERIFY_ARTIFACT_DIR: /tmp/astronomer-verify-enterprise-helm

      - name: Upload commit-bound Helm evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: enterprise-helm-evidence-${{ github.sha }}
          path: /tmp/astronomer-verify-enterprise-helm
          if-no-files-found: error
          retention-days: 90

  container-supply-chain:
    name: image scan and sbom
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        component:
          - server
          - worker
          - agent
          - migrate
          - shell
          - dr
          - frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.0

      - name: Build image locally
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.component == 'frontend' && 'frontend' || '.' }}
          file: ${{ matrix.component == 'server' && 'deploy/docker/Dockerfile.server' || matrix.component == 'worker' && 'deploy/docker/Dockerfile.worker' || matrix.component == 'agent' && 'deploy/docker/Dockerfile.agent' || matrix.component == 'migrate' && 'deploy/docker/Dockerfile.migrate' || matrix.component == 'shell' && 'deploy/docker/Dockerfile.shell' || matrix.component == 'dr' && 'deploy/docker/Dockerfile.dr' || 'frontend/Dockerfile' }}
          load: true
          tags: ${{ matrix.component == 'server' && 'astronomer-go-server' || matrix.component == 'worker' && 'astronomer-go-worker' || matrix.component == 'agent' && 'astronomer-go-agent' || matrix.component == 'migrate' && 'astronomer-go-migrate' || matrix.component == 'shell' && 'astronomer-shell' || matrix.component == 'dr' && 'astronomer-dr' || 'astronomer-frontend' }}:ci
          provenance: false
          sbom: false

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: ${{ matrix.component == 'server' && 'astronomer-go-server' || matrix.component == 'worker' && 'astronomer-go-worker' || matrix.component == 'agent' && 'astronomer-go-agent' || matrix.component == 'migrate' && 'astronomer-go-migrate' || matrix.component == 'shell' && 'astronomer-shell' || matrix.component == 'dr' && 'astronomer-dr' || 'astronomer-frontend' }}:ci
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: "v1.16.0"

      - name: Generate SBOM
        run: |
          syft ${{ matrix.component == 'server' && 'astronomer-go-server' || matrix.component == 'worker' && 'astronomer-go-worker' || matrix.component == 'agent' && 'astronomer-go-agent' || matrix.component == 'migrate' && 'astronomer-go-migrate' || matrix.component == 'shell' && 'astronomer-shell' || matrix.component == 'dr' && 'astronomer-dr' || 'astronomer-frontend' }}:ci \
            -o spdx-json \
            > sbom-${{ matrix.component }}.spdx.json
          test -s sbom-${{ matrix.component }}.spdx.json
          python3 -c "import json; json.load(open('sbom-${{ matrix.component }}.spdx.json'))"

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.component }}-${{ github.sha }}
          path: sbom-${{ matrix.component }}.spdx.json
          retention-days: 30

  enterprise-signoff:
    name: same-commit PR qualification aggregate
    if: always()
    needs:
      - offering-qualification-static
      - backend
      - stateful-qualifications
      - postgres-failover-certification
      - frontend
      - frontend-e2e
      - frontend-e2e-live
      - helm
      - container-supply-chain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require every same-commit qualification
        env:
          RESULTS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          results = json.loads(os.environ["RESULTS_JSON"])
          failed = {name: value["result"] for name, value in results.items() if value["result"] != "success"}
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          lines = ["## Same-commit PR qualification aggregate", "", "| Gate | Result |", "| --- | --- |"]
          lines.extend(f"| `{name}` | {value['result']} |" for name, value in sorted(results.items()))
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write("\n".join(lines) + "\n")
          if failed:
              raise SystemExit(f"required qualification failure: {failed}")
          PY
      - name: Require every protected external producer in the release aggregator contract
        run: |
          ./scripts/check-enterprise-qualification-producers.py > "$RUNNER_TEMP/protected-producers.json"
          python3 - <<'PY'
          import json, os
          value = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "protected-producers.json"), encoding="utf-8"))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n### Protected release qualifications (validated wiring; external signed runs still required)\n\n")
              summary.write("| Producer | Workflow | Environment |\n| --- | --- | --- |\n")
              for row in value["protected_producers"]:
                  summary.write(f"| `{row['id']}` | `{row['workflow']}` | `{row['environment']}` |\n")
          PY
