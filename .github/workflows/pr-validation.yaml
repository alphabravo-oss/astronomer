name: pr-validation

# The Makefile is the single orchestrator (guide ch.04): every job below calls
# a make target that an engineer can run locally with the same result.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  GOFLAGS: -p=4

jobs:
  go-check:
    name: make check (lint vet fmt build test)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Dockerfile Go version must match go.mod
        run: |
          set -euo pipefail
          go_version="$(awk '/^go /{print $2}' go.mod)"
          for f in deploy/docker/Dockerfile.server deploy/docker/Dockerfile.worker deploy/docker/Dockerfile.agent deploy/docker/Dockerfile.shell; do
            grep -q '^ARG GO_VERSION$' "$f" || { echo "$f must declare ARG GO_VERSION (derived from go.mod=$go_version)"; exit 1; }
            grep -Eq '^FROM golang:[0-9]' "$f" && { echo "$f hardcodes a Go version"; exit 1; } || true
            grep -q '^FROM golang:${GO_VERSION}-alpine@${GO_IMAGE_DIGEST} ' "$f" || { echo "$f must digest-pin the builder via ARG GO_IMAGE_DIGEST"; exit 1; }
          done
      - name: Go builder digest pin must match go.mod and the registry
        run: make go-image-check
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.15.0
          args: --timeout=15m
      - run: make vet fmt build
      - run: make test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: go-test-results
          path: test-results/*.xml

  go-integration:
    name: make test-integration (real Postgres + Redis)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: astronomer
          POSTGRES_PASSWORD: astronomer
          POSTGRES_DB: astronomer
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U astronomer" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.10.2-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://astronomer:astronomer@localhost:5432/astronomer?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make migrate DATABASE_URL="$TEST_DATABASE_URL"
      - run: make test-integration
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: go-integration-results
          path: test-results/*.xml

  frontend:
    name: frontend type-check, lint, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci --no-audit --no-fund
      - run: make frontend-check
      - run: cd frontend && npm audit --audit-level=high
      - run: make frontend-build

  helm:
    name: helm lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - run: make helm-lint

  e2e-live:
    name: Playwright live (real server, real login)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci --no-audit --no-fund && npx playwright install chromium --with-deps
      - name: Start the full dev stack (compose + server + worker + Vite)
        env:
          DEV_WATCH: "0"
        run: ./scripts/dev.sh up
      - run: make e2e-live
      - if: always()
        run: ./scripts/dev.sh status; tail -n 100 tmp/logs/server.log || true
      - if: always()
        run: ./scripts/dev.sh down
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-live-results
          path: |
            frontend/e2e-results/
            tmp/logs/
