name: Release upgrade matrix

on:
  workflow_call:
  workflow_dispatch:
  push:
    tags:
      - "v1.*"

permissions:
  contents: read

jobs:
  supported-fixtures:
    name: PostgreSQL 16/17 supported fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Upgrade every supported release fixture
        run: |
          set -o pipefail
          ./scripts/release-upgrade-matrix.sh 2>&1 | tee release-upgrade-matrix.log

      - name: Certify representative query plans and cursor consistency
        env:
          REPORT_DIR: query-plan-artifacts
        run: |
          set -o pipefail
          ./scripts/query-plan-certification.sh 2>&1 | tee query-plan-certification.log

      - name: Retain matrix log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-upgrade-matrix-${{ github.run_id }}
          path: release-upgrade-matrix.log
          if-no-files-found: error
          retention-days: 90

      - name: Retain query-plan certification
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: query-plan-certification-${{ github.run_id }}
          path: |
            query-plan-certification.log
            query-plan-artifacts/*.json
          if-no-files-found: error
          retention-days: 90
