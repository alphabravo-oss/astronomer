name: security-analysis

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-analysis-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-security:
    name: source security policy gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Verify policy fixtures
        run: |
          python3 scripts/tests/gosec_tool_contract_test.py
          python3 scripts/tests/security_source_policy_test.py
          python3 scripts/tests/security_policy_contract_test.py

      - name: Collect source scans (enforcement follows)
        run: |
          mkdir -p security-raw security-reports
          set +e
          export GOWORK=off
          scripts/build-gosec.sh "$RUNNER_TEMP/astronomer-gosec" >security-raw/gosec-build.log 2>&1
          build_status=$?
          if [ "$build_status" -eq 0 ]; then
            env -u GOSEC_AI_PROVIDER -u GOSEC_AI_API_KEY -u GOSEC_AI_BASE_URL "$RUNNER_TEMP/astronomer-gosec" -no-fail -fmt json -out security-raw/gosec.json ./... >security-raw/gosec.log 2>&1
            gosec_status=$?
          else
            gosec_status=$build_status
          fi
          vuln_version=$(sed -n 's/^GOVULNCHECK_VERSION[[:space:]]*[:?]*=[[:space:]]*//p' Makefile)
          go run golang.org/x/vuln/cmd/govulncheck@"$vuln_version" -format sarif -scan symbol ./... \
            >security-raw/govulncheck.sarif 2>security-raw/govulncheck.log
          vuln_status=$?
          printf '{"gosec":%s,"govulncheck":%s}\n' "$gosec_status" "$vuln_status" >security-raw/statuses.json

      - name: Enforce source security policy
        if: ${{ always() }}
        run: |
          python3 scripts/security-source-policy.py \
            --gosec security-raw/gosec.json --govulncheck security-raw/govulncheck.sarif \
            --statuses security-raw/statuses.json --exceptions deploy/security/source-exceptions.json \
            --scope first-party-source-policy --output security-reports

      - name: Scan complete Git history without printing secret values
        if: ${{ always() }}
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.27.2
          export GITLEAKS_BIN="$(go env GOPATH)/bin/gitleaks"
          python3 scripts/tests/security_policy_contract_test.py
          "$GITLEAKS_BIN" git --config=.gitleaks.toml --redact=100 --no-banner --log-opts=--all .

      - name: Retain sanitized findings even when enforcement fails
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-security-policy-${{ github.run_id }}
          path: security-reports/
          if-no-files-found: error

      - name: Upload source findings to code scanning when permitted
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        # Code scanning is an optional presentation surface; the enforced gate and
        # mandatory report artifact remain authoritative when this feature is unavailable.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: security-reports/
          category: source-security
