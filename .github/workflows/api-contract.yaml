name: api-contract

# Focused API contract gate. The authoritative command is also used by
# `make verify`; detailed command output is retained as a failure artifact.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-contract:
    name: api contract gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The openapi .mjs scripts resolve js-yaml via createRequire from
      # frontend/package.json, so the frontend deps must be installed first.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.11.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --global npm@12.2.0 && npm ci

      - name: Run authoritative API contract gate
        run: ./scripts/verify-enterprise.sh api-contract
        env:
          VERIFY_ARTIFACT_DIR: ${{ runner.temp }}/astronomer-verify-api-contract
          OPENAPI_BASELINE: ${{ github.event_name == 'pull_request' && format('{0}:docs/openapi.yaml', github.event.pull_request.base.sha) || github.event_name == 'push' && format('{0}:docs/openapi.yaml', github.event.before) || 'HEAD:docs/openapi.yaml' }}

      - name: Retain API compatibility review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-compatibility-${{ github.sha }}
          path: |
            ${{ runner.temp }}/astronomer-verify-api-contract/openapi-changelog.md
            ${{ runner.temp }}/astronomer-verify-api-contract/openapi-breaking.md
          if-no-files-found: warn
          retention-days: 90

      - name: Upload failed API contract reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-contract-failure-${{ github.sha }}
          path: ${{ runner.temp }}/astronomer-verify-api-contract
          if-no-files-found: warn
          retention-days: 14
