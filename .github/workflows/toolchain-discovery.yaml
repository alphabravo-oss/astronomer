name: toolchain-discovery
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Validate authority
        run: make versions-check
      - name: Discover stable updates for weekly triage
        env:
          GH_TOKEN: ${{ github.token }}
        run: make updates
      - name: Retain current targets and unavailable upstreams
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolchain-discovery-${{ github.sha }}
          path: .artifacts/toolchain-updates.json
          if-no-files-found: error
          include-hidden-files: true
