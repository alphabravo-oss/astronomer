name: estate-1000-soak
clusters: 1000
rps: 3000
duration: 4h
agents:
  mode: simulated
  reconnectStorm: {enabled: true, at: 60m, batchPercent: 100, jitter: 10m}
resources: {podsPerCluster: 1000, deploymentsPerCluster: 250, servicesPerCluster: 350}
eventsPerSecond: 5000
mandatoryAudit: {ratePerSecond: 10, maxOperations: 144600}
day2FailureDrills:
  - agent_reconnect_storm
  - flux_assignment_status_fanout
  - tunnel_owner_failure
  - worker_failure_recovery
  - redis_failover_outbox_recovery
  - postgres_failover
  - management_plane_leader_failure
  - browser_resource_list_budget
  - four_hour_soak_leak_budget
