title = "Astronomer secret scanning policy"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Generated source inventories contain SHA-256 content digests, not credentials"
  condition = "AND"
  regexTarget = "line"
  paths = ['''^advisor-plans/(?:027-ux-audit/source-manifest|028-offering-source-inventory)\.json$''']
  regexes = ['''^\s*"[^"]+":\s*"[0-9a-f]{64}",?\s*$''']

  [[rules.allowlists]]
  description = "Generated API contract evidence is a counter-only HTML marker"
  condition = "AND"
  regexTarget = "line"
  paths = ['''^docs/rancher-astronomer-comparison\.md$''']
  regexes = ['''^<!-- api-contract-evidence: operations=[0-9]+ mounted_routes=[0-9]+/[0-9]+ request_bindings=[0-9]+ provisional_request_shapes=[0-9]+ actionable_202=[0-9]+ async_202_exceptions=[0-9]+ -->$''']

[[rules]]
id = "private-key"

  [[rules.allowlists]]
  description = "Resource form test enters a PEM header without key material"
  condition = "AND"
  regexTarget = "match"
  paths = ['''^frontend/src/components/resources/__tests__/guided-resource-access-sections\.test\.tsx$''']
  regexes = ['''expect\(manifest\)\.toMatchObject''']
