# OpenAPI Overlay (https://github.com/OAI/Overlay-Specification) applied by
# oapi-codegen BEFORE generation (see oapi-codegen.yaml -> output-options.overlay).
#
# WHY THIS EXISTS
# docs/openapi.yaml is the source of truth and is owned by another track, so we
# do not edit it here. Instead this overlay patches three spots that make the
# *generated Go* fail to compile, without changing the wire contract:
#
#   1. ResourceSearchResult includes upstream snake_case Kubernetes metadata
#      alongside the canonical camelCase projection. Both normalize to the
#      same Go field names, so the wire-specific fields need explicit names.
#
# These are codegen-only renames: JSON tags, paths, and request/response bodies
# are unchanged.
overlay: 1.0.0
info:
  title: astroclient codegen fixups
  version: 1.0.0
actions:
  # --- duplicate camel/snake field names in one struct ------------------------
  # ResourceSearchResult.results[].(cluster_id|cluster_name) collide with
  # ResourceRow.clusterId and the sibling clusterName.
  - target: $.components.schemas.ResourceSearchResult.properties.results.items.allOf[1].properties.cluster_id
    description: Rename snake_case dup so it does not collide with ResourceRow.clusterId.
    update:
      x-go-name: ClusterIdSnake
  - target: $.components.schemas.ResourceSearchResult.properties.results.items.allOf[1].properties.cluster_name
    description: Rename snake_case dup so it does not collide with clusterName.
    update:
      x-go-name: ClusterNameSnake
  # Preserve the v1 Go SDK pointer layout while the canonical document states
  # the already-enforced runtime requirements and nullable defaults.
  - target: $.components.schemas.InhibitionRequest.required
    description: Replace the required array rather than append to it in overlay semantics.
    remove: true
  - target: $.components.schemas.InhibitionRequest
    description: Keep optional pointer fields in existing Go clients.
    update:
      required: [name]
  - target: $.components.schemas.InhibitionRequest.properties.equal_labels
    description: Retain *[]string with omitempty in the v1 SDK.
    update:
      nullable: false
  - target: $.components.schemas.InhibitionRequest.properties.enabled
    description: Retain *bool with omitempty in the v1 SDK.
    update:
      nullable: false
