# Air live-reload for the API server. One config per binary (guide ch.04).
root = "."
tmp_dir = "tmp/server"

[build]
  # Same build line as `make build`, so the dev binary reports a real version.
  cmd = "CGO_ENABLED=0 go build -trimpath -ldflags \"-X github.com/alphabravocompany/astronomer-go/pkg/version.Version=dev-$(git rev-parse --short HEAD) -X github.com/alphabravocompany/astronomer-go/pkg/version.GitCommit=$(git rev-parse --short HEAD) -X github.com/alphabravocompany/astronomer-go/pkg/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)\" -o tmp/server/server ./cmd/server"
  bin = "tmp/server/server"
  entrypoint = ["env", "ENV=development", "tmp/server/server"]
  include_ext = ["go", "sql", "yaml"]
  include_dir = ["cmd/server", "internal", "pkg", "deploy/flux", "deploy/bundles", "deploy/agent", "deploy/dashboards"]
  exclude_dir = ["tmp", "bin", "frontend", "node_modules", "docs", "scripts", "deploy/chart", "deploy/docker", "deploy/telemetry", "test-results", "internal/db/sqlc", "pkg/astroclient", "cmd/worker", "cmd/agent", "cmd/astro", "cmd/dexconfigcheck", ".git", ".github"]
  exclude_regex = ["_test\\.go$"]
  delay = 1000
  stop_on_error = true
  send_interrupt = true
  kill_delay = "500ms"
  log = "build-errors.log"

[log]
  time = true

[misc]
  clean_on_exit = false
