services:
  server:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_TRACES_SAMPLER_ARG: "1"
      # Optional route inserted into newly rendered adopted-cluster manifests.
      # It must be reachable from that cluster; Tempo's Docker DNS name is not.
      AGENT_OTEL_EXPORTER_OTLP_ENDPOINT: ${LOCAL_AGENT_OTEL_ENDPOINT:-}
      AGENT_OTEL_EXPORTER_OTLP_INSECURE: "true"
      AGENT_OTEL_TRACES_SAMPLER_ARG: "1"

  worker:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_TRACES_SAMPLER_ARG: "1"

  tempo:
    profiles: ["telemetry"]
    image: grafana/tempo:2.7.2
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./telemetry/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
      - "4318:4318"
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    networks:
      - astronomer-go

  loki:
    profiles: ["telemetry"]
    image: grafana/loki:3.4.2
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./telemetry/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/var/loki
    ports:
      - "3100:3100"
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.75
    security_opt:
      - no-new-privileges:true
    networks:
      - astronomer-go

  promtail:
    profiles: ["telemetry"]
    image: grafana/promtail:3.4.2
    command: ["-config.file=/etc/promtail/promtail.yaml"]
    volumes:
      - ./telemetry/promtail.yaml:/etc/promtail/promtail.yaml:ro
      - promtail_positions:/var/lib/promtail
      # Local-development discovery only. Do not copy this Docker socket mount
      # into a production deployment.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    read_only: true
    security_opt:
      - no-new-privileges:true
    networks:
      - astronomer-go

  prometheus:
    profiles: ["telemetry"]
    image: prom/prometheus:v3.2.1
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --web.enable-lifecycle
    volumes:
      - ./telemetry/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus_data:/prometheus
    ports:
      - "9091:9090"
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    networks:
      - astronomer-go

  grafana:
    profiles: ["telemetry"]
    image: grafana/grafana:11.5.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./telemetry/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - tempo
      - loki
      - prometheus
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.75
    security_opt:
      - no-new-privileges:true
    networks:
      - astronomer-go

volumes:
  tempo_data:
  loki_data:
  promtail_positions:
  prometheus_data:
  grafana_data:
