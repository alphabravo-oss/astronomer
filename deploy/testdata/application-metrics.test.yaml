# Rules are extracted from the chart by TestApplicationMetricsPromQL.
rule_files:
  - rules.yaml
evaluation_interval: 1m
tests:
  - name: targets absent
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 4m
        alertname: AstronomerApplicationMetricsUnavailable
        exp_alerts: []
      - eval_time: 5m
        alertname: AstronomerApplicationMetricsUnavailable
        exp_alerts: &both_unavailable
          - &server_unavailable
            exp_labels:
              severity: warning
              component: server
              namespace: control
              service: astronomer-server-metrics
            exp_annotations:
              summary: Astronomer server metrics unavailable
              description: No healthy scrape target for control/astronomer-server-metrics for 5 minutes. Application demand and health metrics are unknown.
              runbook_url: https://example.test/runbooks/application-metrics-unavailable.md
          - &worker_unavailable
            exp_labels:
              severity: warning
              component: worker
              namespace: control
              service: astronomer-worker-metrics
            exp_annotations:
              summary: Astronomer worker metrics unavailable
              description: No healthy scrape target for control/astronomer-worker-metrics for 5 minutes. Application demand and health metrics are unknown.
              runbook_url: https://example.test/runbooks/application-metrics-unavailable.md

  - name: every replica down
    interval: 1m
    input_series:
      - series: 'up{namespace="control",service="astronomer-server-metrics",instance="a"}'
        values: '0+0x10'
      - series: 'up{namespace="control",service="astronomer-server-metrics",instance="b"}'
        values: '0+0x10'
      - series: 'up{namespace="control",service="astronomer-worker-metrics",instance="a"}'
        values: '0+0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: AstronomerApplicationMetricsUnavailable
        exp_alerts: *both_unavailable

  - name: healthy components
    interval: 1m
    input_series:
      - series: 'up{namespace="control",service="astronomer-server-metrics",instance="a"}'
        values: '1+0x10'
      - series: 'up{namespace="control",service="astronomer-worker-metrics",instance="a"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: AstronomerApplicationMetricsUnavailable
        exp_alerts: []

  - name: one healthy replica per component
    interval: 1m
    input_series:
      - series: 'up{namespace="control",service="astronomer-server-metrics",instance="a"}'
        values: '0+0x10'
      - series: 'up{namespace="control",service="astronomer-server-metrics",instance="b"}'
        values: '1+0x10'
      - series: 'up{namespace="control",service="astronomer-worker-metrics",instance="a"}'
        values: '0+0x10'
      - series: 'up{namespace="control",service="astronomer-worker-metrics",instance="b"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: AstronomerApplicationMetricsUnavailable
        exp_alerts: []

  - name: other release does not hide absence
    interval: 1m
    input_series:
      - series: 'up{namespace="control",service="other-server-metrics"}'
        values: '1+0x10'
      - series: 'up{namespace="control",service="other-worker-metrics"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: AstronomerApplicationMetricsUnavailable
        exp_alerts: *both_unavailable

  - name: other namespace does not hide absence
    interval: 1m
    input_series:
      - series: 'up{namespace="elsewhere",service="astronomer-server-metrics"}'
        values: '1+0x10'
      - series: 'up{namespace="elsewhere",service="astronomer-worker-metrics"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: AstronomerApplicationMetricsUnavailable
        exp_alerts: *both_unavailable

  - name: recovered scrape resolves alert
    interval: 1m
    input_series:
      - series: 'up{namespace="control",service="astronomer-server-metrics"}'
        values: '0+0x5 1+0x5'
      - series: 'up{namespace="control",service="astronomer-worker-metrics"}'
        values: '0+0x5 1+0x5'
    alert_rule_test:
      - eval_time: 5m
        alertname: AstronomerApplicationMetricsUnavailable
        exp_alerts: *both_unavailable
      - eval_time: 6m
        alertname: AstronomerApplicationMetricsUnavailable
        exp_alerts: []

  - name: discovered targets disappear
    interval: 1m
    input_series:
      - series: 'up{namespace="control",service="astronomer-server-metrics"}'
        values: '1 1 stale _ _ _ _ _ _'
      - series: 'up{namespace="control",service="astronomer-worker-metrics"}'
        values: '1 1 stale _ _ _ _ _ _'
    alert_rule_test:
      - eval_time: 6m
        alertname: AstronomerApplicationMetricsUnavailable
        exp_alerts: []
      - eval_time: 7m
        alertname: AstronomerApplicationMetricsUnavailable
        exp_alerts: *both_unavailable

  - name: only server unavailable
    interval: 1m
    input_series:
      - series: 'up{namespace="control",service="astronomer-worker-metrics"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: AstronomerApplicationMetricsUnavailable
        exp_alerts:
          - *server_unavailable

  - name: only worker unavailable
    interval: 1m
    input_series:
      - series: 'up{namespace="control",service="astronomer-server-metrics"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: AstronomerApplicationMetricsUnavailable
        exp_alerts:
          - *worker_unavailable
