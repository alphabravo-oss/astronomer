# Backup overlay for the compact profile: layer after values-single-node.yaml
#   helm upgrade --install astronomer deploy/chart -n astronomer \
#     -f deploy/chart/values-single-node.yaml \
#     -f deploy/chart/values-single-node-backup.yaml -f <site values>
#
# Off-host, non-AWS S3 target: a RustFS (or MinIO) server outside the cluster,
# here 192.0.2.10:9000 (replace address, CIDRs and buckets with your own).
# Two buckets, both created by the operator, never by the chart:
#   astronomer-recovery  CNPG WAL archive + base backups (Barman Cloud plugin)
#   astronomer-mgmt-backup  encrypted pg_dump + key bundle, Object Lock
#     mc mb --with-lock rustfs/astronomer-mgmt-backup
#     mc retention set --default GOVERNANCE 30d rustfs/astronomer-mgmt-backup
#   The backup writer refuses a bucket without Object Lock and a default
#   retention of at least managementBackup.immutability.minimumRetentionDays.
# Secrets (operator-created in the release namespace):
#   astronomer-recovery-s3     keys ACCESS_KEY_ID / SECRET_ACCESS_KEY
#   astronomer-mgmt-backup-s3  key credentials (AWS CLI credentials file, writer)
#   astronomer-mgmt-retention-s3  key credentials (separate retention principal)
#   astronomer-mgmt-backup-wrap   key passphrase (key-wrap secret, held apart)
postgres:
  cloudNativePG:
    barmanCloud:
      enabled: true
      objectStoreName: astronomer-recovery
      objectStore:
        create: true
        destinationPath: s3://astronomer-recovery/
        endpointURL: http://192.0.2.10:9000
        region: us-east-1
        s3Credentials:
          accessKeyId: {name: astronomer-recovery-s3, key: ACCESS_KEY_ID}
          secretAccessKey: {name: astronomer-recovery-s3, key: SECRET_ACCESS_KEY}
        retentionPolicy: 14d
      scheduledBackup:
        enabled: true
        schedule: "0 0 3 * * *"
        immediate: true

managementBackup:
  enabled: true
  schedule: "0 3 * * *"
  s3:
    bucket: astronomer-mgmt-backup
    region: us-east-1
    endpoint: http://192.0.2.10:9000
    credentialsSecretRef: {name: astronomer-mgmt-backup-s3, key: credentials}
  immutability:
    mode: objectLock
    minimumRetentionDays: 30
  retention:
    enabled: true
    # Keep the dry run until the first restore drill has passed; then flip it
    # to false so expired dumps are deleted once their lock lapses.
    dryRun: true
    credentialsSecretRef: {name: astronomer-mgmt-retention-s3, key: credentials}
  encryption:
    # Stable, unique per installation; changing it orphans earlier backups.
    sourceIdentity: single-node-example/astronomer
    wrappingSecretRef: {name: astronomer-mgmt-backup-wrap, key: passphrase}
managementRestoreDrill:
  enabled: true
  schedule: "0 4 * * 1"

networkPolicy:
  # The S3 API of the RustFS host, for the DR jobs and for the CNPG plugin.
  objectStoreEgressCIDRs: [192.0.2.10/32]
  objectStoreEgressPorts: [9000]
  walArchiveEgressCIDRs: [192.0.2.10/32]
  walArchiveEgressPorts: [9000]
