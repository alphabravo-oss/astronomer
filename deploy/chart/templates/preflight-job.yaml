{{- define "astronomer.preflightJobSpec" -}}
{{- $serviceAccountName := .serviceAccountName -}}
{{- with .root }}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "astronomer.componentLabels" (dict "context" . "component" "preflight") | nindent 8 }}
    spec:
      restartPolicy: Never
      # Dedicated hook SA/RBAC and default-deny allow NetworkPolicy are created
      # at hook-weight -10 so this later -5 Job can authenticate and reach the
      # API on both fresh installs and upgrades.
      serviceAccountName: {{ $serviceAccountName }}
      {{- with .Values.preflight.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The read-only database gate runs before Kubernetes prerequisite checks.
      # Failure fails the Helm hook and leaves the database/PVC untouched.
      #
      # IMPORTANT: this init container only runs when the operator points
      # at an *external* Postgres. The chart-bundled Postgres
      # StatefulSet is itself a regular release resource, so it doesn't
      # exist at pre-install-hook time and the connectivity check would
      # always fail. T13's value is gating production-mode installs
      # against an unreachable / mis-configured external DB; that path
      # is preserved here.
      initContainers:
        {{- if eq (include "astronomer.postgresBundledEnabled" .) "false" }}
        - name: db-preflight
          {{- with .Values.preflight.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "astronomer.thirdPartyImage" (dict "repository" .Values.postgres.image.repository "tag" .Values.postgres.image.tag "digest" .Values.postgres.image.digest "registry" .Values.postgres.image.registry "fallback" .Values.image.registry) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: HOME
              value: /tmp
            {{- if .Values.postgres.external.dsnSecretRef.name }}
            # Operator-provided secret: must already exist in the
            # namespace before `helm install`. Pre-install hooks can
            # reference it because secrets are not chart-managed here.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.external.dsnSecretRef.name | quote }}
                  key: {{ .Values.postgres.external.dsnSecretRef.key | quote }}
            {{- else }}
            # Inline the computed URL via the same helper the ConfigMap
            # uses at install time. The ConfigMap itself is a regular
            # release resource, so it doesn't exist when this pre-install
            # hook runs — referencing it via configMapKeyRef stalls the
            # pod in CreateContainerConfigError until helm gives up on
            # the hook. Inlining keeps the preflight self-contained.
            - name: DATABASE_URL
              value: {{ include "astronomer.databaseURL" . | quote }}
            {{- end }}
          command:
            - /bin/sh
            - -ec
            - |
              fail_fresh_install() {
                echo "fresh_install_required: $1"
                echo "Astronomer v1.0.0 never deletes, reformats, or upgrades a pre-v1 database."
                echo "Install v1 with a new release name and an empty database; keep the old release and backup for rollback."
                exit 1
              }

              if ! psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atqc 'SELECT 1' >/dev/null 2>&1; then
                echo "Refusing release: cannot connect to Postgres with the configured DATABASE_URL."
                exit 1
              fi

              legacy_tables=$(psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atqc "
                SELECT COALESCE(string_agg(c.relname, ',' ORDER BY c.relname), '')
                FROM pg_catalog.pg_class c
                JOIN pg_catalog.pg_namespace n ON n.oid = c.relnamespace
                WHERE n.nspname = 'public'
                  AND c.relkind IN ('r', 'p')
                  AND c.relname IN (
                    'argo' || 'cd_baseline_ownership_decisions',
                    'argo' || 'cd_cluster_proxy_tokens',
                    'argo' || 'cd_managed_clusters',
                    'argo' || 'cd_operation_events',
                    'argo' || 'cd_operations',
                    'argo' || 'cd_applications',
                    'argo' || 'cd_instances',
                    'fl' || 'eet_operation_targets',
                    'fl' || 'eet_operations'
                  );") || {
                echo "Refusing release: PostgreSQL catalog inspection failed."
                exit 1
              }
              if [ -n "$legacy_tables" ]; then
                fail_fresh_install "legacy delivery tables detected: ${legacy_tables}"
              fi

              has_migrations=$(psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atqc "SELECT to_regclass('public.schema_migrations') IS NOT NULL;") || exit 1
              if [ "$has_migrations" != "t" ]; then
                public_tables=$(psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atqc "
                  SELECT count(*) FROM pg_catalog.pg_class c
                  JOIN pg_catalog.pg_namespace n ON n.oid = c.relnamespace
                  WHERE n.nspname = 'public' AND c.relkind IN ('r', 'p');") || exit 1
                if [ "$public_tables" != "0" ]; then
                  fail_fresh_install "unknown public schema without schema_migrations"
                fi
                echo "Empty PostgreSQL database detected; fresh v1 install is allowed."
                exit 0
              fi

              migration_state=$(psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -AtF '|' -c "
                SELECT count(*), COALESCE(max(version), 0), COALESCE(bool_or(dirty), false)
                FROM public.schema_migrations;") || {
                echo "Refusing release: schema_migrations inspection failed."
                exit 1
              }
              migration_rows=$(printf '%s' "$migration_state" | cut -d '|' -f 1)
              migration_version=$(printf '%s' "$migration_state" | cut -d '|' -f 2)
              migration_dirty=$(printf '%s' "$migration_state" | cut -d '|' -f 3)
              if [ "$migration_rows" != "1" ] || [ "$migration_version" != "{{ .Values.preflight.freshInstall.acceptedSchemaVersion }}" ] || [ "$migration_dirty" != "f" ]; then
                fail_fresh_install "expected one clean schema_migrations row at version {{ .Values.preflight.freshInstall.acceptedSchemaVersion }}, found rows=${migration_rows} version=${migration_version} dirty=${migration_dirty}"
              fi

              missing_v1_tables=$(psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atqc "
                WITH required(name) AS (VALUES
                  ('delivery_sources'), ('component_bundles'), ('component_bundle_versions'),
                  ('delivery_targets'), ('delivery_rollouts'), ('delivery_rollout_clusters'),
                  ('delivery_rollout_approvals'), ('delivery_rollout_events'),
                  ('cluster_deployments'), ('cluster_deployment_events'),
                  ('delivery_source_resolutions'), ('delivery_assignment_receipts'),
                  ('delivery_controller_inventory')
                )
                SELECT COALESCE(string_agg(name, ',' ORDER BY name), '')
                FROM required WHERE to_regclass('public.' || name) IS NULL;") || exit 1
              if [ -n "$missing_v1_tables" ]; then
                fail_fresh_install "schema version is 1 but required v1 tables are missing: ${missing_v1_tables}"
              fi
              echo "Existing clean Astronomer v1 database accepted."
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        {{- end }}
      containers:
        - name: preflight
          {{- with .Values.preflight.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "astronomer.thirdPartyImage" (dict "repository" .Values.preflight.image.repository "tag" .Values.preflight.image.tag "digest" .Values.preflight.image.digest "registry" .Values.preflight.image.registry "fallback" (.Values.image.registry | default "ghcr.io/alphabravo-oss")) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: HOME
              value: /tmp
          command:
            - /bin/sh
            - -ec
            - |
              umask 077
              PREFLIGHT_TMP_DIR=$(mktemp -d /tmp/astronomer-preflight.XXXXXX)
              trap 'rm -rf "${PREFLIGHT_TMP_DIR}"' EXIT HUP INT TERM
              # Hook RBAC objects are created before this Job, but Kubernetes
              # authorization caches/informers can observe the Job before the
              # new RoleBindings become usable. Every live API read therefore
              # uses one bounded helper with three explicit outcomes:
              #   0 = object present / read succeeded
              #   1 = authorized read returned Kubernetes NotFound
              #   2 = authorization or transport never became usable
              # Callers decide whether outcome 1 is allowed; outcome 2 always
              # fails closed. Per-call files live in a private, uniquely
              # named directory and are removed by the process-level trap.
              PREFLIGHT_READ_ATTEMPTS=10
              PREFLIGHT_READ_DELAY_SECONDS=1
              KUBE_READ_OUTPUT=""

              kube_read() {
                read_description="$1"
                shift
                read_attempt=1
                read_stdout=$(mktemp "${PREFLIGHT_TMP_DIR}/read.stdout.XXXXXX")
                read_stderr=$(mktemp "${PREFLIGHT_TMP_DIR}/read.stderr.XXXXXX")
                while [ "$read_attempt" -le "$PREFLIGHT_READ_ATTEMPTS" ]; do
                  read_rc=0
                  kubectl "$@" >"$read_stdout" 2>"$read_stderr" || read_rc=$?
                  if [ "$read_rc" -eq 0 ]; then
                    KUBE_READ_OUTPUT=$(cat "$read_stdout")
                    rm -f "$read_stdout" "$read_stderr"
                    return 0
                  fi

                  read_error=$(cat "$read_stderr")
                  if echo "$read_error" | grep -Fq 'Error from server (NotFound)'; then
                    echo "Kubernetes API reports ${read_description} absent: ${read_error}" >&2
                    rm -f "$read_stdout" "$read_stderr"
                    return 1
                  fi

                  echo "Kubernetes API read not ready for ${read_description} (attempt ${read_attempt}/${PREFLIGHT_READ_ATTEMPTS}, exit ${read_rc}): ${read_error}" >&2
                  if [ "$read_attempt" -lt "$PREFLIGHT_READ_ATTEMPTS" ]; then
                    sleep "$PREFLIGHT_READ_DELAY_SECONDS"
                  fi
                  read_attempt=$((read_attempt + 1))
                done

                echo "Kubernetes API read failed for ${read_description} after ${PREFLIGHT_READ_ATTEMPTS} attempts." >&2
                echo "Check preflight ServiceAccount RBAC propagation and Kubernetes API connectivity, then retry the release." >&2
                rm -f "$read_stdout" "$read_stderr"
                return 2
              }

              {{- if and .Values.dex.enabled (eq .Values.dex.migration.phase "fresh") }}
              DEX_LEGACY_CONFIGMAP={{ printf "%s-dex-config" (include "astronomer.fullname" .) | quote }}
              if kube_read "legacy Dex ConfigMap ${DEX_LEGACY_CONFIGMAP}" get configmap "${DEX_LEGACY_CONFIGMAP}" -n {{ .Release.Namespace | quote }} -o name; then
                echo "Refusing direct Dex cutover: legacy ConfigMap detected. Run prepare, populate the runtime Secret, then run cutover."
                exit 1
              else
                legacy_status=$?
                if [ "${legacy_status}" -ne 1 ]; then
                  echo "Refusing release: could not prove the legacy Dex ConfigMap is absent."
                  exit 1
                fi
              fi
              KUBE_READ_OUTPUT=""
              {{- end }}
              {{- if and .Values.dex.enabled (or .Values.dex.migration.requirePreparedConfig (eq .Values.dex.migration.phase "cutover")) }}
              {{- if eq .Values.dex.migration.phase "cutover" }}
              DEX_LEGACY_CONFIGMAP={{ printf "%s-dex-config-retained" (include "astronomer.fullname" .) | quote }}
              if ! kube_read "prepared legacy Dex ConfigMap ${DEX_LEGACY_CONFIGMAP}" get configmap "${DEX_LEGACY_CONFIGMAP}" -n {{ .Release.Namespace | quote }} -o json; then
                echo "Refusing Dex cutover: the prepare release and retained legacy ConfigMap are required first."
                exit 1
              fi
              if ! printf '%s' "${KUBE_READ_OUTPUT}" | jq -e '.metadata.annotations["astronomer.io/dex-migration-phase"] == "prepared"' >/dev/null; then
                echo "Refusing Dex cutover: legacy ConfigMap lacks the durable prepare-phase marker."
                exit 1
              fi
              KUBE_READ_OUTPUT=""
              {{- end }}
              DEX_RUNTIME_SECRET={{ default (printf "%s-dex-runtime" (include "astronomer.fullname" .)) .Values.dex.runtimeSecretName | quote }}
              if ! kube_read "prepared Dex runtime Secret metadata ${DEX_RUNTIME_SECRET}" get secret "${DEX_RUNTIME_SECRET}" -n {{ .Release.Namespace | quote }} -o 'jsonpath={.type}{"\n"}{.metadata.labels.astronomer\.io/runtime-writer}{"\n"}{.metadata.labels.astronomer\.io/secret-purpose}'; then
                echo "Refusing release: Dex runtime Secret ${DEX_RUNTIME_SECRET} is missing. Restore it from the operator-owned secret source; see docs/secret-handling-policy.md."
                exit 1
              fi
              dex_secret_metadata=${KUBE_READ_OUTPUT}
              KUBE_READ_OUTPUT=""
              if [ "${dex_secret_metadata}" != "$(printf 'Opaque\ndex-handler\ndex-runtime')" ]; then
                echo "Refusing release: Dex runtime Secret ${DEX_RUNTIME_SECRET} lacks exact ownership labels or Opaque type."
                exit 1
              fi
              dex_secret_metadata=""
              if ! kube_read "prepared Dex runtime Secret config field ${DEX_RUNTIME_SECRET}" get secret "${DEX_RUNTIME_SECRET}" -n {{ .Release.Namespace | quote }} -o 'jsonpath={.data.config\.yaml}'; then
                echo "Refusing release: Dex runtime Secret ${DEX_RUNTIME_SECRET} has an unreadable config.yaml field."
                exit 1
              fi
              dex_config_b64=${KUBE_READ_OUTPUT}
              KUBE_READ_OUTPUT=""
              # The exact base64 field is bounded before decoding. Decoded
              # bytes flow through a private FIFO directly to the validator;
              # plaintext configuration is never written to a regular file.
              if [ -z "${dex_config_b64}" ] || [ "${#dex_config_b64}" -gt 1398104 ]; then
                echo "Refusing release: Dex runtime config exceeds the 1 MiB preflight limit."
                exit 1
              fi
              dex_config_fifo=$(mktemp "${PREFLIGHT_TMP_DIR}/dex-config.XXXXXX")
              rm -f "${dex_config_fifo}"
              mkfifo -m 600 "${dex_config_fifo}"
              printf '%s' "${dex_config_b64}" | base64 -d >"${dex_config_fifo}" 2>/dev/null &
              dex_decode_pid=$!
              dex_config_b64=""
              dex_validate_rc=0
              dexconfigcheck --max-bytes 1048576 <"${dex_config_fifo}" || dex_validate_rc=$?
              dex_decode_rc=0
              wait "${dex_decode_pid}" || dex_decode_rc=$?
              rm -f "${dex_config_fifo}"
              if [ "${dex_decode_rc}" -ne 0 ]; then
                echo "Refusing release: Dex runtime config is not valid base64."
                exit 1
              fi
              if [ "${dex_validate_rc}" -ne 0 ]; then
                echo "Refusing release: Dex runtime config failed YAML and semantic validation."
                exit 1
              fi
              {{- end }}

              if [ "{{ .Values.gateway.enabled }}" = "true" ]; then
                if kube_read "Gateway API CRD gateways.gateway.networking.k8s.io" get crd gateways.gateway.networking.k8s.io -o name; then
                  :
                else
                  read_status=$?
                  if [ "$read_status" -eq 1 ]; then
                    echo "Refusing release: Gateway API CRD gateways.gateway.networking.k8s.io is missing."
                    echo "Install Gateway API support and a compatible controller before installing this chart."
                  else
                    echo "Refusing release: could not verify Gateway API CRD gateways.gateway.networking.k8s.io because the Kubernetes API read never became usable."
                  fi
                  exit 1
                fi

                if kube_read "Gateway API CRD httproutes.gateway.networking.k8s.io" get crd httproutes.gateway.networking.k8s.io -o name; then
                  :
                else
                  read_status=$?
                  if [ "$read_status" -eq 1 ]; then
                    echo "Refusing release: Gateway API CRD httproutes.gateway.networking.k8s.io is missing."
                    echo "Install Gateway API support and a compatible controller before installing this chart."
                  else
                    echo "Refusing release: could not verify Gateway API CRD httproutes.gateway.networking.k8s.io because the Kubernetes API read never became usable."
                  fi
                  exit 1
                fi

                if kube_read "GatewayClass {{ .Values.gateway.className }}" get gatewayclass "{{ .Values.gateway.className }}" -o name; then
                  :
                else
                  read_status=$?
                  if [ "$read_status" -eq 1 ]; then
                    echo "Refusing release: GatewayClass {{ .Values.gateway.className }} is missing."
                    echo "Install a Gateway controller that provides that class before installing this chart."
                  else
                    echo "Refusing release: could not verify GatewayClass {{ .Values.gateway.className }} because the Kubernetes API read never became usable."
                  fi
                  exit 1
                fi

                echo "Gateway API prerequisites found."
              fi

              # cert-manager preflight — only fires when the selected TLS mode
              # actually needs the CRDs (selfSigned or letsEncrypt). source=secret
              # is BYO and source=none is HTTP-only, so neither requires cert-manager.
              {{- $tlsSrc := include "astronomer.tls.source" . }}
              {{- if and (or (eq $tlsSrc "selfSigned") (eq $tlsSrc "letsEncrypt")) .Values.tls.requireCertManager }}
              if kube_read "cert-manager CRD issuers.cert-manager.io" get crd issuers.cert-manager.io -o name; then
                :
              else
                read_status=$?
                if [ "$read_status" -eq 1 ]; then
                  echo "Refusing release: tls.source={{ $tlsSrc }} requires cert-manager but the CRD"
                  echo "issuers.cert-manager.io was not found in the cluster."
                  echo ""
                  echo "Install cert-manager:"
                  echo "  kubectl apply -f https://github.com/cert-manager/cert-manager/releases/latest/download/cert-manager.yaml"
                  echo ""
                  echo "Or set tls.requireCertManager=false if cert-manager will be installed"
                  echo "after this release applies."
                else
                  echo "Refusing release: could not verify cert-manager CRD issuers.cert-manager.io because the Kubernetes API read never became usable."
                fi
                exit 1
              fi
              if kube_read "cert-manager CRD certificates.cert-manager.io" get crd certificates.cert-manager.io -o name; then
                :
              else
                read_status=$?
                if [ "$read_status" -eq 1 ]; then
                  echo "Refusing release: cert-manager CRD certificates.cert-manager.io is missing."
                  echo "Reinstall cert-manager (the issuers.cert-manager.io CRD was found but certificates.cert-manager.io was not)."
                else
                  echo "Refusing release: could not verify cert-manager CRD certificates.cert-manager.io because the Kubernetes API read never became usable."
                fi
                exit 1
              fi
              echo "cert-manager prerequisites found."
              {{- end }}

              # Validate additional-trusted-CAs Secret exists when referenced.
              {{- if and .Values.tls.additionalTrustedCAs.enabled .Values.tls.additionalTrustedCAs.existingSecret }}
              if kube_read "additional trusted CA Secret {{ .Values.tls.additionalTrustedCAs.existingSecret }}" get secret "{{ .Values.tls.additionalTrustedCAs.existingSecret }}" -n "{{ .Release.Namespace }}" -o name; then
                :
              else
                read_status=$?
                if [ "$read_status" -eq 1 ]; then
                  echo "Refusing release: tls.additionalTrustedCAs.existingSecret={{ .Values.tls.additionalTrustedCAs.existingSecret }} not found in namespace {{ .Release.Namespace }}."
                  echo "Create the Secret with key tls.crt (PEM bundle) first."
                else
                  echo "Refusing release: could not verify additional trusted CA Secret {{ .Values.tls.additionalTrustedCAs.existingSecret }} because the Kubernetes API read never became usable."
                fi
                exit 1
              fi
              echo "additionalTrustedCAs Secret found."
              {{- end }}

              {{- if .Values.delivery.sourceResolution.proxy.enabled }}
              if ! kube_read "delivery source proxy Secret key" get secret {{ .Values.delivery.sourceResolution.proxy.urlSecretRef.name | quote }} -n {{ .Release.Namespace | quote }} -o json; then
                echo "Refusing release: delivery source proxy Secret or key is unavailable."
                exit 1
              fi
              if ! printf '%s' "$KUBE_READ_OUTPUT" | jq -e --arg key {{ .Values.delivery.sourceResolution.proxy.urlSecretRef.key | quote }} '.data[$key] | type == "string" and length > 0' >/dev/null; then
                echo "Refusing release: delivery source proxy Secret key is empty."
                exit 1
              fi
              KUBE_READ_OUTPUT=""
              echo "Delivery source proxy Secret found."
              {{- end }}

              {{- if .Values.delivery.sourceResolution.ca.existingSecret }}
              if ! kube_read "delivery source CA Secret key" get secret {{ .Values.delivery.sourceResolution.ca.existingSecret | quote }} -n {{ .Release.Namespace | quote }} -o json; then
                echo "Refusing release: delivery source CA Secret or key is unavailable."
                exit 1
              fi
              if ! printf '%s' "$KUBE_READ_OUTPUT" | jq -e --arg key {{ .Values.delivery.sourceResolution.ca.key | quote }} '.data[$key] | type == "string" and length > 0' >/dev/null; then
                echo "Refusing release: delivery source CA Secret key is empty."
                exit 1
              fi
              KUBE_READ_OUTPUT=""
              echo "Delivery source CA Secret found."
              {{- end }}

              # Production Postgres DSN must use TLS. The inline-DSN case is
              # caught at helm-render time by requireProductionInputs; this
              # block covers the Secret-ref case where helm couldn't inspect
              # the value (FEATURES-051126 T01).
              {{- if and (eq (default "" .Values.config.env) "production") .Values.postgres.external.dsnSecretRef.name }}
              dsn_secret="{{ .Values.postgres.external.dsnSecretRef.name }}"
              dsn_key="{{ .Values.postgres.external.dsnSecretRef.key }}"
              if kube_read "Postgres DSN Secret ${dsn_secret} key ${dsn_key}" get secret "$dsn_secret" -n "{{ .Release.Namespace }}" -o "jsonpath={.data.${dsn_key}}"; then
                dsn_encoded="$KUBE_READ_OUTPUT"
              else
                read_status=$?
                if [ "$read_status" -eq 1 ]; then
                  echo "Refusing release: postgres DSN secret/${dsn_secret} was not found in namespace {{ .Release.Namespace }}."
                else
                  echo "Refusing release: could not read postgres DSN secret/${dsn_secret} because the Kubernetes API read never became usable."
                fi
                exit 1
              fi
              dsn_val=""
              if [ -n "$dsn_encoded" ]; then
                dsn_val=$(printf '%s' "$dsn_encoded" | base64 -d) || {
                  echo "Refusing release: postgres DSN secret/${dsn_secret} key=${dsn_key} is not valid base64 data."
                  exit 1
                }
              fi
              if [ -z "$dsn_val" ]; then
                echo "Refusing release: postgres DSN secret/${dsn_secret} key=${dsn_key} is missing or empty."
                exit 1
              fi
              # Match any of require / verify-ca / verify-full. Anything else
              # (including sslmode=disable, sslmode=allow, sslmode=prefer, or
              # no sslmode parameter at all — which Postgres treats as prefer
              # and silently downgrades to plaintext if the server allows) is
              # a production-posture violation.
              if ! echo "$dsn_val" | grep -qE 'sslmode=(require|verify-ca|verify-full)'; then
                echo "Refusing release: postgres DSN in secret/${dsn_secret} does not enforce TLS."
                echo "Production must use sslmode=require, verify-ca, or verify-full."
                echo "Edit the secret to include one of those modes and re-apply, then retry."
                exit 1
              fi
              echo "Production Postgres DSN TLS check passed."
              {{- end }}

              if [ "{{ include "astronomer.postgresBundledEnabled" . }}" = "true" ]; then
                echo "Bundled Postgres remains enabled; preflight passes."
                exit 0
              fi

              legacy_pvc="data-{{ include "astronomer.fullname" . }}-postgres-0"
              if kube_read "legacy bundled Postgres PVC ${legacy_pvc}" get pvc "${legacy_pvc}" -n "{{ .Release.Namespace }}" -o name; then
                echo "Refusing upgrade: detected legacy bundled Postgres PVC ${legacy_pvc} in namespace {{ .Release.Namespace }}."
                echo "The v1 chart accepts only the clean v1 schema. Create a fresh v1 database; see docs/upgrade-runbook.md."
                exit 1
              else
                read_status=$?
                if [ "$read_status" -ne 1 ]; then
                  echo "Refusing release: could not determine whether legacy bundled Postgres PVC ${legacy_pvc} exists because the Kubernetes API read never became usable."
                  exit 1
                fi
              fi

              echo "No legacy bundled Postgres PVC detected; preflight passes."
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
{{- end }}

{{- if .Values.preflight.enabled }}
# Helm pre-release validation. It is read-only against external PostgreSQL and
# fails closed before the migration workload starts.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "astronomer.fullname" . }}-preflight
  labels:
    {{- include "astronomer.componentLabels" (dict "context" . "component" "preflight") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
{{ include "astronomer.preflightJobSpec" (dict "root" . "serviceAccountName" (printf "%s-preflight" (include "astronomer.serviceAccountName" .))) }}
{{- end }}
