{{- if .Values.networkPolicy.enabled }}
{{- $externalCIDRs := .Values.networkPolicy.externalEgressCIDRs | default (list) -}}
{{- $externalHTTPSEgressCIDRs := .Values.networkPolicy.externalHTTPSEgressCIDRs | default (list) -}}
{{- $externalPostgresEgressCIDRs := .Values.networkPolicy.externalPostgresEgressCIDRs | default (list) -}}
{{- $externalRedisEgressCIDRs := .Values.networkPolicy.externalRedisEgressCIDRs | default (list) -}}
{{- $kubernetesAPIEgressCIDRs := .Values.networkPolicy.kubernetesAPIEgressCIDRs | default (list) -}}
{{- $identityProviderEgressCIDRs := .Values.networkPolicy.identityProviderEgressCIDRs | default (list) -}}
{{- $objectStoreEgressCIDRs := .Values.networkPolicy.objectStoreEgressCIDRs | default (list) -}}
{{- $loggingSinkEgressCIDRs := .Values.networkPolicy.loggingSinkEgressCIDRs | default (list) -}}
{{- if .Values.networkPolicy.defaultDeny }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "astronomer.fullname" . }}-default-deny
  labels:
    {{- include "astronomer.labels" . | nindent 4 }}
    app.kubernetes.io/component: network-policy
spec:
  # Select only pods owned by this Astronomer chart release. A negative
  # part-of selector also matches pods where that label is absent, which would
  # capture independently managed namespace infrastructure such as the NGINX
  # Gateway Fabric data plane and leave it unable to reach its controller.
  # The exact ownership tuple keeps every Astronomer platform component under
  # default deny while excluding NGF and unrelated pods.
  podSelector:
    matchLabels:
      {{- include "astronomer.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/part-of: astronomer
  policyTypes:
    - Ingress
    - Egress
---
{{- end }}
{{- if .Values.frontend.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "astronomer.fullname" . }}-frontend
  labels:
    {{- include "astronomer.componentLabels" (dict "context" . "component" "frontend") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "astronomer.componentSelectorLabels" (dict "context" . "component" "frontend") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if .Values.networkPolicy.allowPublicIngress }}
    - ports:
        - protocol: TCP
          port: 3000
    {{- end }}
  # The frontend is a static SPA container (nginx): the browser talks to the
  # server through the gateway/ingress, never pod-to-pod, so no egress beyond
  # DNS is needed.
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "astronomer.fullname" . }}-server
  labels:
    {{- include "astronomer.componentLabels" (dict "context" . "component" "server") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "astronomer.componentSelectorLabels" (dict "context" . "component" "server") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if .Values.networkPolicy.allowPublicIngress }}
    - ports:
        - protocol: TCP
          port: {{ .Values.server.service.port }}
    {{- end }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "astronomer.componentSelectorLabels" (dict "context" . "component" "server") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.server.service.port }}
    {{- if .Values.networkPolicy.allowMetricsIngress }}
    - ports:
        - protocol: TCP
          port: 9090
    {{- end }}
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              {{- include "astronomer.componentSelectorLabels" (dict "context" . "component" "server") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.server.service.port }}
    {{- if ne (include "astronomer.postgresMode" .) "external" }}
    - to:
        - podSelector:
            matchLabels:
              {{- if eq (include "astronomer.postgresMode" .) "cloudNativePG" }}
              cnpg.io/cluster: {{ include "astronomer.cnpgClusterName" . | quote }}
              {{- else }}
              {{- include "astronomer.componentSelectorLabels" (dict "context" . "component" "postgres") | nindent 14 }}
              {{- end }}
      ports:
        - protocol: TCP
          port: {{ $.Values.postgres.port }}
    {{- end }}
    {{- if ne (include "astronomer.redisMode" .) "external" }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "astronomer.componentSelectorLabels" (dict "context" . "component" "redis") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ $.Values.redis.port }}
    {{- end }}
    {{- if eq (include "astronomer.redisMode" .) "sentinel" }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "astronomer.componentSelectorLabels" (dict "context" . "component" "redis-sentinel") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 26379
    {{- end }}
    {{- if .Values.dex.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "astronomer.componentSelectorLabels" (dict "context" . "component" "dex") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5556
    {{- end }}
    {{- range $cidr := $externalCIDRs }}
    - to:
        - ipBlock:
            cidr: {{ $cidr | quote }}
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 6443
    {{- end }}
    {{- range $cidr := $externalHTTPSEgressCIDRs }}
    - to:
        - ipBlock:
            cidr: {{ $cidr | quote }}
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
    {{- end }}
    {{- range $cidr := $externalPostgresEgressCIDRs }}
    - to:
        - ipBlock:
            cidr: {{ $cidr | quote }}
      ports:
        - protocol: TCP
          port: {{ $.Values.postgres.port }}
    {{- end }}
    {{- range $cidr := $externalRedisEgressCIDRs }}
    - to:
        - ipBlock:
            cidr: {{ $cidr | quote }}
      ports:
        - protocol: TCP
          port: {{ $.Values.redis.port }}
    {{- end }}
    {{- range $cidr := $kubernetesAPIEgressCIDRs }}
    - to:
        - ipBlock:
            cidr: {{ $cidr | quote }}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "astronomer.fullname" . }}-worker
  labels:
    {{- include "astronomer.componentLabels" (dict "context" . "component" "worker") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "astronomer.componentSelectorLabels" (dict "context" . "component" "worker") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if .Values.networkPolicy.allowMetricsIngress }}
    - ports:
        - protocol: TCP
          port: 9090
    {{- end }}
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # The worker's monitoring reconciler health-checks managed Prometheus and
    # Alertmanager services directly. Stacks may live in any operator-selected
    # namespace, so select the upstream workload identity across namespaces and
    # expose only their API ports.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - prometheus
                  - alertmanager
      ports:
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 9093
    {{- if ne (include "astronomer.postgresMode" .) "external" }}
    - to:
        - podSelector:
            matchLabels:
              {{- if eq (include "astronomer.postgresMode" .) "cloudNativePG" }}
              cnpg.io/cluster: {{ include "astronomer.cnpgClusterName" . | quote }}
              {{- else }}
              {{- include "astronomer.componentSelectorLabels" (dict "context" . "component" "postgres") | nindent 14 }}
              {{- end }}
      ports:
        - protocol: TCP
          port: {{ $.Values.postgres.port }}
    {{- end }}
    {{- if ne (include "astronomer.redisMode" .) "external" }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "astronomer.componentSelectorLabels" (dict "context" . "component" "redis") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ $.Values.redis.port }}
    {{- end }}
    {{- if eq (include "astronomer.redisMode" .) "sentinel" }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "astronomer.componentSelectorLabels" (dict "context" . "component" "redis-sentinel") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 26379
    {{- end }}
    {{- range $cidr := .Values.delivery.sourceResolution.egressCIDRs }}
    # Source resolution stays behind application-layer SSRF, redirect, and DNS
    # rebinding validation; this CIDR allowlist is a second network boundary.
    - to:
        - ipBlock:
            cidr: {{ $cidr | quote }}
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
        {{- if $.Values.delivery.sourceResolution.allowSSH }}
        - protocol: TCP
          port: 22
        {{- end }}
    {{- end }}
    {{- range $cidr := $externalCIDRs }}
    - to:
        - ipBlock:
            cidr: {{ $cidr | quote }}
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 6443
    {{- end }}
    {{- range $cidr := $externalHTTPSEgressCIDRs }}
    - to:
        - ipBlock:
            cidr: {{ $cidr | quote }}
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
    {{- end }}
    {{- range $cidr := $externalPostgresEgressCIDRs }}
    - to:
        - ipBlock:
            cidr: {{ $cidr | quote }}
      ports:
        - protocol: TCP
          port: {{ $.Values.postgres.port }}
    {{- end }}
    {{- range $cidr := $externalRedisEgressCIDRs }}
    - to:
        - ipBlock:
            cidr: {{ $cidr | quote }}
      ports:
        - protocol: TCP
          port: {{ $.Values.redis.port }}
    {{- end }}
    {{- range $cidr := $kubernetesAPIEgressCIDRs }}
    - to:
        - ipBlock:
            cidr: {{ $cidr | quote }}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    {{- end }}
{{- if .Values.dex.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "astronomer.fullname" . }}-dex
  labels:
    {{- include "astronomer.componentLabels" (dict "context" . "component" "dex") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "astronomer.componentSelectorLabels" (dict "context" . "component" "dex") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if .Values.networkPolicy.allowPublicIngress }}
    - ports:
        - protocol: TCP
          port: 5556
    {{- end }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "astronomer.componentSelectorLabels" (dict "context" . "component" "server") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5556
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- range $cidr := $externalCIDRs }}
    - to:
        - ipBlock:
            cidr: {{ $cidr | quote }}
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 389
        - protocol: TCP
          port: 636
    {{- end }}
    {{- range $cidr := $externalHTTPSEgressCIDRs }}
    - to:
        - ipBlock:
            cidr: {{ $cidr | quote }}
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
    {{- end }}
    {{- range $cidr := $identityProviderEgressCIDRs }}
    - to:
        - ipBlock:
            cidr: {{ $cidr | quote }}
      ports:
        - protocol: TCP
          port: 389
        - protocol: TCP
          port: 636
        - protocol: TCP
          port: 443
    {{- end }}
    # Dex's Kubernetes storage backend reads/writes dex.coreos.com CRDs.
    # Keep this explicit: broad connector egress is not portable for Service
    # ClusterIP traffic because CNIs may enforce NetworkPolicy before or after
    # kube-proxy DNAT.
    {{- range $cidr := $kubernetesAPIEgressCIDRs }}
    - to:
        - ipBlock:
            cidr: {{ $cidr | quote }}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    {{- end }}
{{- end }}
{{- if ne (include "astronomer.postgresMode" .) "external" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "astronomer.fullname" . }}-postgres
  labels:
    {{- include "astronomer.componentLabels" (dict "context" . "component" "postgres") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- if eq (include "astronomer.postgresMode" .) "cloudNativePG" }}
      cnpg.io/cluster: {{ include "astronomer.cnpgClusterName" . | quote }}
      {{- else }}
      {{- include "astronomer.componentSelectorLabels" (dict "context" . "component" "postgres") | nindent 6 }}
      {{- end }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "astronomer.componentSelectorLabels" (dict "context" . "component" "server") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "astronomer.componentSelectorLabels" (dict "context" . "component" "worker") | nindent 14 }}
        # The migrate Job (post-install/upgrade hook) connects to apply schema
        # migrations — without this it's blocked by default-deny and the install
        # stalls in Init forever.
        - podSelector:
            matchLabels:
              {{- include "astronomer.componentSelectorLabels" (dict "context" . "component" "migrate") | nindent 14 }}
        {{- if and .Values.managementBackup.enabled .Values.managementBackup.s3.bucket .Values.managementBackup.s3.credentialsSecretRef.name }}
        - podSelector:
            matchLabels:
              {{- include "astronomer.componentSelectorLabels" (dict "context" . "component" "management-backup") | nindent 14 }}
        {{- if .Values.managementRestoreDrill.enabled }}
        - podSelector:
            matchLabels:
              {{- include "astronomer.componentSelectorLabels" (dict "context" . "component" "restore-drill") | nindent 14 }}
        {{- end }}
        {{- end }}
        {{- if eq (include "astronomer.postgresMode" .) "cloudNativePG" }}
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ include "astronomer.cnpgClusterName" . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.postgres.port }}
    {{- if eq (include "astronomer.postgresMode" .) "cloudNativePG" }}
    # The CNPG controller reconciles instance state through the instance
    # manager HTTPS endpoint. Blocking 8000 leaves failover stuck with
    # "Instance Status Extraction Error" even though PostgreSQL replication
    # itself remains healthy.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
      ports:
        - protocol: TCP
          port: 8000
    {{- end }}
  {{- if eq (include "astronomer.postgresMode" .) "cloudNativePG" }}
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ include "astronomer.cnpgClusterName" . | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.postgres.port }}
    {{- range $cidr := $kubernetesAPIEgressCIDRs }}
    - to:
        - ipBlock:
            cidr: {{ $cidr | quote }}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    {{- end }}
  {{- else }}
  egress: []
  {{- end }}
{{- end }}
{{- if ne (include "astronomer.redisMode" .) "external" }}
---
