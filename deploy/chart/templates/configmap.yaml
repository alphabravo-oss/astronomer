{{- /* Render-time guard: when config.env=production, refuse to install
       unless the operator has provided the bare minimum production wiring
       (external DBs, TLS, real secrets, hostnames). See the helper for the
       full check list and the README's "Dev vs. Production Posture"
       section for the recipe. The helper returns ""; we discard the
       result so this only fails the render, never injects manifest text. */}}
{{- $_ := include "astronomer.validateInputs" . -}}
{{- $_ := include "astronomer.validateImageSkew" . -}}
{{- $_ := include "astronomer.requireSecretMaterial" . -}}
{{- $_ := include "astronomer.requireProductionInputs" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "astronomer.fullname" . }}-config
  labels:
    {{- include "astronomer.labels" . | nindent 4 }}
data:
  # Authoritative Helm release identity for management-plane diagnostics and
  # Charlie's product context. These are chart metadata, not operator input.
  RELEASE_NAME: {{ .Release.Name | quote }}
  CHART_VERSION: {{ .Chart.Version | quote }}
  DATABASE_URL: {{ include "astronomer.databaseURL" . | quote }}
  REDIS_URL: {{ include "astronomer.redisURL" . | quote }}
  ENV: {{ .Values.config.env | quote }}
  DEBUG: {{ .Values.config.debug | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | quote }}
  TRUSTED_PROXY_CIDRS: {{ join "," .Values.config.trustedProxyCIDRs | quote }}
  # External URL of this install; seeds platform_configuration.server_url.
  SERVER_URL: {{ .Values.config.serverURL | default "" | quote }}
  # Running server image — grafana-proxy extraObjects must use this, not a
  # hardcoded v1.0.0 tag. Honour registry + digest the same as the server pod.
  ASTRONOMER_SERVER_IMAGE: {{ include "astronomer.image" (dict "context" . "component" "server") | quote }}
  {{- if .Values.gateway.enabled }}
  ASTRONOMER_GATEWAY_CLASS: {{ .Values.gateway.className | quote }}
  ASTRONOMER_GATEWAY_NAME: {{ include "astronomer.fullname" . | quote }}
  {{- end }}
  {{- if .Values.ingress.enabled }}
  ASTRONOMER_INGRESS_CLASS: {{ .Values.ingress.className | quote }}
  {{- end }}
  # Agent image the server renders into install.yaml for adopted clusters.
  # Derives from image.agent (registry-aware: GHCR online, mirror in air-gap) so
  # adopted clusters pull from the same place as the management plane. An
  # explicit config.agentImage* still overrides.
  AGENT_IMAGE_REPOSITORY: {{ .Values.config.agentImageRepository | default (include "astronomer.agentImageRepository" .) | quote }}
  AGENT_IMAGE_TAG: {{ .Values.config.agentImageTag | default .Values.image.agent.tag | quote }}
  # Flux-native delivery v2 is unconditional in v1. These are bounded runtime
  # controls and immutable artifact references, never inline credentials.
  DELIVERY_ENABLED: {{ .Values.delivery.enabled | quote }}
  DELIVERY_KUBERNETES_MIN_MINOR: {{ .Values.delivery.compatibility.kubernetes.minimumMinor | quote }}
  DELIVERY_KUBERNETES_MAX_MINOR: {{ .Values.delivery.compatibility.kubernetes.maximumMinor | quote }}
  DELIVERY_AGENT_PROTOCOL_MIN: {{ .Values.delivery.compatibility.agentProtocol.minimum | quote }}
  DELIVERY_AGENT_PROTOCOL_MAX: {{ .Values.delivery.compatibility.agentProtocol.maximum | quote }}
  DELIVERY_FLUX_VERSION: {{ .Values.delivery.compatibility.flux.version | quote }}
  DELIVERY_PUBLIC_REGISTRY: {{ .Values.delivery.artifacts.publicRegistry | quote }}
  DELIVERY_PRIVATE_REGISTRY: {{ .Values.delivery.artifacts.privateRegistry | quote }}
  DELIVERY_REGISTRY_REWRITES: {{ toJson .Values.delivery.artifacts.registryRewrites | quote }}
  DELIVERY_FLUX_DISTRIBUTION_REPOSITORY: {{ .Values.delivery.artifacts.fluxDistribution.ociRepository | quote }}
  DELIVERY_FLUX_DISTRIBUTION_DIGEST: {{ .Values.delivery.artifacts.fluxDistribution.digest | quote }}
  DELIVERY_FLUX_DISTRIBUTION_ASSET_PATH: {{ .Values.delivery.artifacts.fluxDistribution.disconnectedAssetPath | quote }}
  DELIVERY_FLUX_DISTRIBUTION_REQUIRE_SIGNATURE: {{ .Values.delivery.artifacts.fluxDistribution.trustPolicy.requireSignature | quote }}
  DELIVERY_FLUX_DISTRIBUTION_CERTIFICATE_IDENTITY: {{ .Values.delivery.artifacts.fluxDistribution.trustPolicy.certificateIdentity | quote }}
  DELIVERY_FLUX_DISTRIBUTION_OIDC_ISSUER: {{ .Values.delivery.artifacts.fluxDistribution.trustPolicy.oidcIssuer | quote }}
  DELIVERY_BUNDLE_REPOSITORY: {{ .Values.delivery.artifacts.builtInBundles.ociRepository | quote }}
  DELIVERY_BUNDLE_DIGEST: {{ .Values.delivery.artifacts.builtInBundles.digest | quote }}
  DELIVERY_BUNDLE_ASSET_PATH: {{ .Values.delivery.artifacts.builtInBundles.disconnectedAssetPath | quote }}
  DELIVERY_BUNDLE_REQUIRE_SIGNATURE: {{ .Values.delivery.artifacts.builtInBundles.trustPolicy.requireSignature | quote }}
  DELIVERY_BUNDLE_CERTIFICATE_IDENTITY: {{ .Values.delivery.artifacts.builtInBundles.trustPolicy.certificateIdentity | quote }}
  DELIVERY_BUNDLE_OIDC_ISSUER: {{ .Values.delivery.artifacts.builtInBundles.trustPolicy.oidcIssuer | quote }}
  DELIVERY_SOURCE_RESOLUTION_CONCURRENCY: {{ .Values.delivery.sourceResolution.workerConcurrency | quote }}
  DELIVERY_SOURCE_MAX_ARTIFACT_BYTES: {{ .Values.delivery.sourceResolution.maxArtifactBytes | int64 | quote }}
  DELIVERY_SOURCE_MAX_HELM_CHART_BYTES: {{ .Values.delivery.sourceResolution.maxHelmChartBytes | int64 | quote }}
  DELIVERY_SOURCE_EGRESS_CIDRS: {{ toJson .Values.delivery.sourceResolution.egressCIDRs | quote }}
  DELIVERY_SOURCE_ALLOWED_PRIVATE_HOSTS: {{ toJson .Values.delivery.sourceResolution.allowedPrivateHosts | quote }}

  DELIVERY_SOURCE_ALLOW_SSH: {{ .Values.delivery.sourceResolution.allowSSH | quote }}
  DELIVERY_ROLLOUT_CONCURRENCY: {{ .Values.delivery.rollout.workerConcurrency | quote }}
  DELIVERY_ROLLOUT_MAX_ACTIVE: {{ .Values.delivery.rollout.maxActiveRollouts | quote }}
  DELIVERY_ROLLOUT_MAX_CLUSTERS: {{ .Values.delivery.rollout.maxClustersPerRollout | quote }}
  DELIVERY_ROLLOUT_MAX_CONCURRENT_CLUSTERS: {{ .Values.delivery.rollout.maxConcurrentClustersGlobal | quote }}
  DELIVERY_ROLLOUT_DEFAULT_FAILURE_BUDGET: {{ .Values.delivery.rollout.defaultFailureBudget | quote }}
  DELIVERY_STATUS_RETENTION_DAYS: {{ .Values.delivery.status.retentionDays | quote }}
  DELIVERY_STATUS_HISTORY_PER_DEPLOYMENT: {{ .Values.delivery.status.historyPerDeployment | quote }}
  DELIVERY_STATUS_COALESCE_WINDOW_SECONDS: {{ .Values.delivery.status.coalesceWindowSeconds | quote }}
  DELIVERY_SLO_ASSIGNMENT_ACK_SECONDS_P99: {{ .Values.delivery.monitoring.assignmentAckSecondsP99 | quote }}
  DELIVERY_SLO_FLUX_VISIBILITY_SECONDS_P99: {{ .Values.delivery.monitoring.fluxTransitionVisibilitySecondsP99 | quote }}
  DELIVERY_SLO_ROLLOUT_SCHEDULER_SECONDS_P99: {{ .Values.delivery.monitoring.rolloutSchedulerSecondsP99 | quote }}
  DELIVERY_STATUS_STALE_SECONDS: {{ .Values.delivery.monitoring.staleClusterStatusSeconds | quote }}
  # Auth hardening (migration 039). Empty / unset == binary defaults
  # (5 attempts / 15 minutes).
  {{- if .Values.config.loginFailureThreshold }}
  LOGIN_FAILURE_THRESHOLD: {{ .Values.config.loginFailureThreshold | quote }}
  {{- end }}
  {{- if .Values.config.lockoutDurationMinutes }}
  LOCKOUT_DURATION_MINUTES: {{ .Values.config.lockoutDurationMinutes | quote }}
  {{- end }}
  # Migration 045 — Dex bootstrap. When dex.enabled=true the server's boot
  # path auto-wires dex_settings to point at the in-chart Dex Deployment +
  # retained runtime Secret so the first connector + Apply works without a manual settings
  # step. Empty / unset == bootstrap skipped (legacy operator-managed Dex).
  {{- if .Values.dex.enabled }}
  DEX_BUNDLED_ENABLED: "true"
  DEX_BUNDLED_NAMESPACE: {{ .Release.Namespace | quote }}
  DEX_BUNDLED_RELEASE_NAME: {{ .Release.Name | quote }}
  DEX_BUNDLED_DEPLOYMENT_NAME: {{ printf "%s-dex" (include "astronomer.fullname" .) | quote }}
  DEX_BUNDLED_SERVICE_NAME: {{ printf "%s-dex" (include "astronomer.fullname" .) | quote }}
  DEX_BUNDLED_RUNTIME_SECRET_NAME: {{ default (printf "%s-dex-runtime" (include "astronomer.fullname" .)) .Values.dex.runtimeSecretName | quote }}
  DEX_BUNDLED_MIGRATION_PHASE: {{ .Values.dex.migration.phase | quote }}
  DEX_BUNDLED_ISSUER_URL: {{ include "astronomer.dex.issuerURL" . | quote }}
  {{- end }}
  {{- if and .Values.config.auth .Values.config.auth.localPasswordOnly }}
  AUTH_LOCAL_PASSWORD_ONLY: "true"
  {{- end }}
  # 2FA / TOTP (migration 043). Empty issuer == binary default ("Astronomer").
  # require=true makes 2FA mandatory for all local-password users.
  {{- with .Values.config.auth }}
  {{- with .totp }}
  {{- if .issuer }}
  TOTP_ISSUER: {{ .issuer | quote }}
  {{- end }}
  {{- if .require }}
  TOTP_REQUIRE: {{ .require | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  # In-browser kubectl shell (migration 065 / sprint 17). Disabled by
  # default; flip on once audit-log retention is sized for the
  # per-command rows. See docs/kubectl-shell.md.
  {{- with .Values.kubectlShell }}
  KUBECTL_SHELL_ENABLED: {{ .enabled | quote }}
  # Same astronomer-shell image as preflight, rendered registry-aware (GHCR
  # online, mirror in air-gap). An explicit kubectlShell.image overrides.
  KUBECTL_SHELL_IMAGE: {{ .image | default (include "astronomer.thirdPartyImage" (dict "repository" $.Values.preflight.image.repository "tag" $.Values.preflight.image.tag "digest" $.Values.preflight.image.digest "registry" $.Values.preflight.image.registry "fallback" ($.Values.image.registry | default "ghcr.io/alphabravo-oss"))) | quote }}
  {{- if .idleTimeoutMinutes }}
  KUBECTL_SHELL_IDLE_TIMEOUT_MINUTES: {{ .idleTimeoutMinutes | quote }}
  {{- end }}
  {{- if .sessionHardCapHours }}
  KUBECTL_SHELL_SESSION_HARD_CAP_HOURS: {{ .sessionHardCapHours | quote }}
  {{- end }}
  {{- end }}
  # pgxpool tunables (FEATURES-051126 T21). Empty == binary default.
  {{- with .Values.postgres.pool }}
  {{- if .maxConns }}
  DB_MAX_CONNS: {{ .maxConns | quote }}
  {{- end }}
  {{- if .minConns }}
  DB_MIN_CONNS: {{ .minConns | quote }}
  {{- end }}
  {{- if .maxConnLifetimeMinutes }}
  DB_MAX_CONN_LIFETIME_MINUTES: {{ .maxConnLifetimeMinutes | quote }}
  {{- end }}
  {{- if .maxConnIdleMinutes }}
  DB_MAX_CONN_IDLE_MINUTES: {{ .maxConnIdleMinutes | quote }}
  {{- end }}
  {{- if .healthCheckPeriodSeconds }}
  DB_HEALTH_CHECK_PERIOD_SECONDS: {{ .healthCheckPeriodSeconds | quote }}
  {{- end }}
  {{- end }}
  # T15 — distributed tracing. All four vars are no-ops when endpoint is
  # empty (the InitTracing helper short-circuits), so this stays render-
  # safe for installs that don't opt in.
  {{- with .Values.observability }}
  {{- with .tracing }}
  {{- if .endpoint }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .endpoint | quote }}
  {{- end }}
  {{- if .insecure }}
  OTEL_EXPORTER_OTLP_INSECURE: {{ .insecure | quote }}
  {{- end }}
  {{- if .headers }}
  OTEL_EXPORTER_OTLP_HEADERS: {{ .headers | quote }}
  {{- end }}
  {{- if .samplerRatio }}
  OTEL_TRACES_SAMPLER_ARG: {{ .samplerRatio | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  # Image + SA the server uses when reconciling per-destination management
  # backup CronJobs from Settings → Astronomer backup. Destinations live in
  # the DB; Helm S3 values are no longer required to turn dumps on.
  MANAGEMENT_BACKUP_IMAGE: {{ include "astronomer.thirdPartyImage" (dict "repository" .Values.managementBackup.image.repository "tag" .Values.managementBackup.image.tag "digest" .Values.managementBackup.image.digest "registry" .Values.managementBackup.image.registry "fallback" .Values.image.registry) | quote }}
  MANAGEMENT_BACKUP_SERVICE_ACCOUNT: {{ include "astronomer.serviceAccountName" . | quote }}

