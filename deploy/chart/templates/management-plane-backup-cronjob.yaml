{{- if and .Values.managementBackup.enabled .Values.managementBackup.s3.bucket .Values.managementBackup.s3.credentialsSecretRef.name .Values.managementBackup.encryption.sourceIdentity .Values.managementBackup.encryption.wrappingSecretRef.name .Values.managementBackup.encryptionKeyBackup.enabled }}
{{- /*
  The writer can create objects but has no retention/deletion credentials. It
  validates Object Lock before touching the database, encrypts dump and key
  material client-side, and uploads the authenticated manifest last as the
  commit marker for one complete backup set.
*/ -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "astronomer.fullname" . }}-management-backup
  labels:
    {{- include "astronomer.componentLabels" (dict "context" . "component" "management-backup") | nindent 4 }}
spec:
  schedule: {{ .Values.managementBackup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.managementBackup.successfulJobsHistoryLimit | default 3 }}
  failedJobsHistoryLimit: {{ .Values.managementBackup.failedJobsHistoryLimit | default 3 }}
  startingDeadlineSeconds: {{ .Values.managementBackup.startingDeadlineSeconds | default 600 }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.managementBackup.backoffLimit | default 2 }}
      ttlSecondsAfterFinished: {{ .Values.managementBackup.ttlSecondsAfterFinished | default 86400 }}
      template:
        metadata:
          labels:
            {{- include "astronomer.componentLabels" (dict "context" . "component" "management-backup") | nindent 12 }}
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          {{- with .Values.managementBackup.podSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.image.pullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.managementBackup.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.managementBackup.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: pgdump-s3
              {{- with .Values.managementBackup.securityContext }}
              securityContext:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              image: {{ include "astronomer.thirdPartyImage" (dict "repository" .Values.managementBackup.image.repository "tag" .Values.managementBackup.image.tag "digest" .Values.managementBackup.image.digest "registry" .Values.managementBackup.image.registry "fallback" .Values.image.registry) | quote }}
              imagePullPolicy: {{ .Values.managementBackup.image.pullPolicy | default "IfNotPresent" }}
              command: ["/bin/sh", "-eu", "-c"]
              args:
                - |
                  set -eu
                  umask 077

                  STAMP="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
                  DOW="$(date -u +%u)"
                  DOM="$(date -u +%d)"
                  BUCKET="${MANAGEMENT_BACKUP_BUCKET}"
                  PREFIX="${MANAGEMENT_BACKUP_PREFIX:-astronomer-pg}"
                  RELEASE="${MANAGEMENT_BACKUP_RELEASE}"
                  BASE="${PREFIX}/${RELEASE}"
                  KEY_OBJECT="${BASE}/${KEYBACKUP_PREFIX}/${STAMP}.keys.tar.aead"
                  DUMP_PATH="/tmp/${STAMP}.pgcustom"
                  DUMP_ENVELOPE="${DUMP_PATH}.aead"
                  KEY_BUNDLE="/tmp/${STAMP}.keys.tar"
                  KEY_ENVELOPE="${KEY_BUNDLE}.aead"
                  MANIFEST_PATH="/tmp/${STAMP}.manifest.json"
                  CONTEXT="{\"release\":\"${MANAGEMENT_BACKUP_NAMESPACE}/${RELEASE}\",\"source\":\"${MANAGEMENT_BACKUP_SOURCE_IDENTITY}\",\"stamp\":\"${STAMP}\"}"

                  cleanup() {
                    rm -f "${DUMP_PATH}" "${DUMP_ENVELOPE}" "${KEY_BUNDLE}" "${KEY_ENVELOPE}" "${MANIFEST_PATH}"
                    find /var/run/astronomer-keys -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
                  }
                  trap cleanup EXIT

                  export AWS_SHARED_CREDENTIALS_FILE=/var/run/aws/credentials
                  export AWS_DEFAULT_REGION="${MANAGEMENT_BACKUP_REGION}"
                  AWS_S3_FLAGS=""
                  if [ -n "${MANAGEMENT_BACKUP_ENDPOINT:-}" ]; then
                    AWS_S3_FLAGS="--endpoint-url ${MANAGEMENT_BACKUP_ENDPOINT}"
                  fi

                  # Object Lock is checked before pg_dump so a configuration
                  # regression cannot create an unprotected recovery point.
                  LOCK_STATUS="$(aws s3api get-object-lock-configuration ${AWS_S3_FLAGS} \
                    --bucket "${BUCKET}" \
                    --query '[ObjectLockConfiguration.ObjectLockEnabled,ObjectLockConfiguration.Rule.DefaultRetention.Days,ObjectLockConfiguration.Rule.DefaultRetention.Years]' \
                    --output text)" || { echo "bucket Object Lock validation failed" >&2; exit 1; }
                  set -- ${LOCK_STATUS}
                  if [ "${1:-}" != "Enabled" ]; then
                    echo "bucket Object Lock is not enabled" >&2
                    exit 1
                  fi
                  LOCK_DAYS=0
                  case "${2:-}" in ''|None) ;; *) LOCK_DAYS="$2" ;; esac
                  case "${3:-}" in ''|None) ;; *) LOCK_DAYS="$((LOCK_DAYS + ($3 * 365)))" ;; esac
                  if [ "${LOCK_DAYS}" -lt "${MANAGEMENT_BACKUP_MINIMUM_RETENTION_DAYS}" ]; then
                    echo "bucket default Object Lock retention (${LOCK_DAYS}d) is below required ${MANAGEMENT_BACKUP_MINIMUM_RETENTION_DAYS}d" >&2
                    exit 1
                  fi

                  SCHEMA_VERSION="$(psql "${DATABASE_URL}" -v ON_ERROR_STOP=1 -At -c \
                    'SELECT version FROM schema_migrations WHERE dirty = false ORDER BY version DESC LIMIT 1;')"
                  case "${SCHEMA_VERSION}" in ''|*[!0-9]*) echo "could not determine a clean database schema version" >&2; exit 1 ;; esac

                  echo "Starting authenticated management backup ${STAMP} (schema=${SCHEMA_VERSION})"
                  pg_dump --dbname="${DATABASE_URL}" --format=custom --no-owner --no-acl --file="${DUMP_PATH}"
                  dr-crypto encrypt --input "${DUMP_PATH}" --output "${DUMP_ENVELOPE}" \
                    --passphrase-file /var/run/astronomer-wrap/passphrase \
                    --purpose database-dump --context "${CONTEXT}"
                  rm -f "${DUMP_PATH}"

                  cp -aL /var/run/astronomer-keys-source/. /var/run/astronomer-keys/
                  {{- if .Values.managementBackup.encryptionKeyBackup.secretName }}
                  cp -L /var/run/astronomer-keys-source/SECRET_KEY /var/run/astronomer-keys/SECRET_KEY
                  cp -L /var/run/astronomer-keys-source/ASTRONOMER_ENCRYPTION_KEY /var/run/astronomer-keys/ASTRONOMER_ENCRYPTION_KEY
                  {{- else }}
                  cp -L "/var/run/astronomer-keys-source/{{ .Values.secrets.secretKeyKey }}" /var/run/astronomer-keys/SECRET_KEY
                  cp -L "/var/run/astronomer-keys-source/{{ .Values.secrets.encryptionKeyKey }}" /var/run/astronomer-keys/ASTRONOMER_ENCRYPTION_KEY
                  {{- end }}
                  dr-crypto key-bundle-create --source /var/run/astronomer-keys --output "${KEY_BUNDLE}"
                  dr-crypto encrypt --input "${KEY_BUNDLE}" --output "${KEY_ENVELOPE}" \
                    --passphrase-file /var/run/astronomer-wrap/passphrase \
                    --purpose key-bundle --context "${CONTEXT}"
                  rm -f "${KEY_BUNDLE}"

                  # Manifest upload is the commit marker and always happens
                  # after both ciphertext payloads exist.
                  aws s3 cp ${AWS_S3_FLAGS} "${KEY_ENVELOPE}" "s3://${BUCKET}/${KEY_OBJECT}"
                  upload_tier() {
                    TIER="$1"
                    ARCHIVE_OBJECT="${BASE}/${TIER}/${STAMP}.pgcustom.aead"
                    MANIFEST_OBJECT="${BASE}/${TIER}/${STAMP}.manifest.json"
                    rm -f "${MANIFEST_PATH}"
                    dr-crypto manifest-create \
                      --archive "${DUMP_ENVELOPE}" --archive-key "${ARCHIVE_OBJECT}" \
                      --key-bundle "${KEY_ENVELOPE}" --key-bundle-key "${KEY_OBJECT}" \
                      --passphrase-file /var/run/astronomer-wrap/passphrase \
                      --release-name "${RELEASE}" --release-namespace "${MANAGEMENT_BACKUP_NAMESPACE}" \
                      --chart-version "${MANAGEMENT_BACKUP_CHART_VERSION}" \
                      --source-identity "${MANAGEMENT_BACKUP_SOURCE_IDENTITY}" \
                      --database-schema-version "${SCHEMA_VERSION}" --created-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                      --output "${MANIFEST_PATH}"
                    aws s3 cp ${AWS_S3_FLAGS} "${DUMP_ENVELOPE}" "s3://${BUCKET}/${ARCHIVE_OBJECT}"
                    aws s3 cp ${AWS_S3_FLAGS} "${MANIFEST_PATH}" "s3://${BUCKET}/${MANIFEST_OBJECT}"
                    echo "Committed ${TIER} backup manifest: s3://${BUCKET}/${MANIFEST_OBJECT}"
                  }

                  upload_tier daily
                  if [ "${DOW}" = 7 ]; then upload_tier weekly; fi
                  if [ "${DOM}" = 01 ]; then upload_tier monthly; fi
                  echo "Backup OK."
              env:
                - name: HOME
                  value: /tmp
                - name: MANAGEMENT_BACKUP_RELEASE
                  value: {{ .Release.Name | quote }}
                - name: MANAGEMENT_BACKUP_NAMESPACE
                  value: {{ .Release.Namespace | quote }}
                - name: MANAGEMENT_BACKUP_CHART_VERSION
                  value: {{ .Chart.AppVersion | quote }}
                - name: MANAGEMENT_BACKUP_SOURCE_IDENTITY
                  value: {{ .Values.managementBackup.encryption.sourceIdentity | quote }}
                - name: MANAGEMENT_BACKUP_BUCKET
                  value: {{ .Values.managementBackup.s3.bucket | quote }}
                - name: MANAGEMENT_BACKUP_REGION
                  value: {{ .Values.managementBackup.s3.region | quote }}
                - name: MANAGEMENT_BACKUP_PREFIX
                  value: {{ .Values.managementBackup.s3.prefix | default "astronomer-pg" | quote }}
                - name: MANAGEMENT_BACKUP_MINIMUM_RETENTION_DAYS
                  value: {{ .Values.managementBackup.immutability.minimumRetentionDays | quote }}
                - name: KEYBACKUP_PREFIX
                  value: {{ .Values.managementBackup.encryptionKeyBackup.keyPrefix | default "keys" | quote }}
                - name: KEYBACKUP_ENABLED
                  value: "aead-v1"
                {{- with .Values.managementBackup.s3.endpoint }}
                - name: MANAGEMENT_BACKUP_ENDPOINT
                  value: {{ . | quote }}
                {{- end }}
                {{- if .Values.postgres.external.dsnSecretRef.name }}
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.postgres.external.dsnSecretRef.name | quote }}
                      key: {{ .Values.postgres.external.dsnSecretRef.key | quote }}
                {{- else }}
                - name: DATABASE_URL
                  valueFrom:
                    configMapKeyRef:
                      name: {{ include "astronomer.fullname" . }}-config
                      key: DATABASE_URL
                {{- end }}
              volumeMounts:
                - name: aws-credentials
                  mountPath: /var/run/aws
                  readOnly: true
                - name: scratch
                  mountPath: /tmp
                - name: encryption-keys
                  mountPath: /var/run/astronomer-keys
                - name: encryption-keys-source
                  mountPath: /var/run/astronomer-keys-source
                  readOnly: true
                - name: wrapping-passphrase
                  mountPath: /var/run/astronomer-wrap
                  readOnly: true
              resources:
                {{- toYaml .Values.managementBackup.resources | nindent 16 }}
          volumes:
            - name: aws-credentials
              secret:
                secretName: {{ .Values.managementBackup.s3.credentialsSecretRef.name | quote }}
                items:
                  - key: {{ .Values.managementBackup.s3.credentialsSecretRef.key | default "credentials" | quote }}
                    path: credentials
            - name: scratch
              emptyDir:
                sizeLimit: {{ .Values.managementBackup.scratchSizeLimit | default "8Gi" | quote }}
            - name: encryption-keys
              emptyDir:
                sizeLimit: 16Mi
            - name: encryption-keys-source
              secret:
                secretName: {{ .Values.managementBackup.encryptionKeyBackup.secretName | default (include "astronomer.secretsSecretName" .) | quote }}
            - name: wrapping-passphrase
              secret:
                secretName: {{ .Values.managementBackup.encryption.wrappingSecretRef.name | quote }}
                items:
                  - key: {{ .Values.managementBackup.encryption.wrappingSecretRef.key | default "passphrase" | quote }}
                    path: passphrase
{{- end }}
