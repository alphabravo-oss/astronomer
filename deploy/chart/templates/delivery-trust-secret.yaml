{{- $trust := .Values.delivery.sourceResolution.trustKeys -}}
{{- if and (not $trust.existingSecret) $trust.chartManagedTrustedRoot }}
{{- $root := .Files.Get "files/sigstore/trusted_root.json" -}}
{{- if not (contains "application/vnd.dev.sigstore.trustedroot+json" $root) -}}
{{- fail "files/sigstore/trusted_root.json is missing or is not a Sigstore trusted root" -}}
{{- end }}
# Pinned Sigstore public-good trusted root for the in-process delivery verifier
# (keyless Fulcio + Rekor, offline: the server never contacts TUF).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "astronomer.deliveryTrustSecretName" . }}
  labels:
    {{- include "astronomer.componentLabels" (dict "context" . "component" "delivery-trust") | nindent 4 }}
  annotations:
    checksum/trusted-root: {{ $root | sha256sum }}
type: Opaque
data:
  trusted_root.json: {{ $root | b64enc }}
{{- end }}
