{{- if and (eq (include "astronomer.redisMode" .) "sentinel") (not .Values.redis.sentinel.passwordSecretRef.name) -}}
{{- $name := include "astronomer.redisPasswordSecretName" . -}}
{{- $key := include "astronomer.redisPasswordSecretKey" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $password := "" -}}
{{- if and $existing $existing.data (index $existing.data $key) -}}
  {{- $password = index $existing.data $key | b64dec -}}
{{- else -}}
  {{- $password = randAlphaNum 32 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "astronomer.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ $key | quote }}: {{ $password | quote }}
{{- end }}
