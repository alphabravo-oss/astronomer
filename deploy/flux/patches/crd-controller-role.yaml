- op: replace
  path: /rules
  value:
    - apiGroups:
        - source.toolkit.fluxcd.io
        - kustomize.toolkit.fluxcd.io
        - helm.toolkit.fluxcd.io
      resources:
        - '*'
      verbs:
        - '*'
    - apiGroups:
        - ""
      resources:
        - namespaces
        - secrets
        - configmaps
        - serviceaccounts
      verbs:
        - get
        - list
        - watch
    - apiGroups:
        - ""
      resources:
        - events
      verbs:
        - create
        - patch
    - apiGroups:
        - ""
      resources:
        - configmaps
      verbs:
        - create
        - update
        - patch
        - delete
    - apiGroups:
        - ""
      resources:
        - configmaps/status
      verbs:
        - get
        - update
        - patch
    - apiGroups:
        - coordination.k8s.io
      resources:
        - leases
      verbs:
        - get
        - list
        - watch
        - create
        - update
        - patch
        - delete
    - apiGroups:
        - ""
      resources:
        - serviceaccounts/token
      verbs:
        - create
    - nonResourceURLs:
        - /livez/ping
      verbs:
        - head
