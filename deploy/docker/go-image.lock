# Single pin for the Go builder image used by every Dockerfile with a Go build
# stage (server, worker, agent, shell). Included by the Makefile and
# read by the PR/release workflows. GO_IMAGE_VERSION must equal go.mod's `go`
# line and GO_IMAGE_DIGEST must be the multi-arch index digest of
# golang:$(GO_IMAGE_VERSION)-alpine; `make go-image-check` enforces both.
# Bump: edit go.mod, then
#   docker buildx imagetools inspect golang:<version>-alpine --format '{{json .Manifest.Digest}}'
GO_IMAGE_VERSION = 1.27.4
GO_IMAGE_DIGEST  = sha256:0a5f7fe796599ff487605987432e7619ae45beeb2fba4c2ce0b907879932aebf
