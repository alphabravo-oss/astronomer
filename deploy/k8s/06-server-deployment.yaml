apiVersion: apps/v1
kind: Deployment
metadata:
  name: astronomer-server
  namespace: astronomer
  labels:
    app.kubernetes.io/name: astronomer
    app.kubernetes.io/component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: astronomer
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: astronomer
        app.kubernetes.io/component: server
    spec:
      containers:
        - name: server
          image: astronomer-go-server:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: CHARLIE_MCP_LISTEN_ADDRESS
              value: ":7444"
            - name: CHARLIE_MCP_TLS_CERT_FILE
              value: /var/run/secrets/astronomer/charlie-mcp/tls.crt
            - name: CHARLIE_MCP_TLS_KEY_FILE
              value: /var/run/secrets/astronomer/charlie-mcp/tls.key
            - name: CHARLIE_MCP_CLIENT_CA_FILE
              value: /var/run/secrets/astronomer/charlie-mcp/ca.crt
            - name: CHARLIE_MCP_ACTION_SIGNING_KEY_FILE
              value: /var/run/secrets/astronomer/charlie-mcp/action-signing-public-key
            - name: CHARLIE_BRIDGE_TLS_CERT_FILE
              value: /var/run/secrets/astronomer/charlie-bridge/tls.crt
            - name: CHARLIE_BRIDGE_TLS_KEY_FILE
              value: /var/run/secrets/astronomer/charlie-bridge/tls.key
            - name: CHARLIE_BRIDGE_CA_FILE
              value: /var/run/secrets/astronomer/charlie-bridge/ca.crt
            - name: CHARLIE_AGENT_NAMESPACE
              value: astronomer-charlie
            # L19: needed for the cross-pod tunnel locator if this is ever scaled
            # past replicas:1 — without it a multi-replica deployment silently
            # disables cross-pod proxy and non-owning replicas 503.
            - name: ASTRONOMER_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          envFrom:
            - configMapRef:
                name: astronomer-config
            - secretRef:
                name: astronomer-secrets
          livenessProbe:
            httpGet:
              path: /health/
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health/
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: charlie-mcp-tls
              mountPath: /var/run/secrets/astronomer/charlie-mcp
              readOnly: true
            - name: charlie-bridge-tls
              mountPath: /var/run/secrets/astronomer/charlie-bridge
              readOnly: true
      volumes:
        - name: charlie-mcp-tls
          secret:
            secretName: astronomer-charlie-mcp-tls
            optional: true
        - name: charlie-bridge-tls
          secret:
            secretName: astronomer-charlie-bridge-client-tls
            optional: true
