# sigstore policy-controller (Helm chart policy-controller 0.10.8, app 0.13.1,
# repo https://sigstore.github.io/helm-charts) for signature admission in the
# Astronomer namespace. Install:
#   helm upgrade --install policy-controller policy-controller \
#     --repo https://sigstore.github.io/helm-charts --version 0.10.8 \
#     -n cosign-system --create-namespace -f deploy/policy-controller/values.yaml
#   kubectl apply -f deploy/policy-controller/cip-astronomer.yaml
#   kubectl label ns astronomer policy.sigstore.dev/include=true
# See docs/verify-images.md ("Admission enforcement").
webhook:
  replicaCount: 1
  # Fail closed. Install with Ignore first if the control plane must stay
  # writable while the policies are proven with --dry-run=server.
  failurePolicy: Fail
  # Images in an opted-in namespace that match no ClusterImagePolicy are
  # rejected (chart-managed ConfigMap config-policy-controller).
  configData:
    no-match-policy: deny
  webhookTimeoutSeconds:
    defaulting: 10
    validating: 10
  podDisruptionBudget:
    enabled: false
  resources:
    requests: {cpu: 50m, memory: 96Mi}
    limits: {cpu: 500m, memory: 384Mi}
leasescleanup:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {cpu: 100m, memory: 64Mi}
