# ClusterImagePolicies for namespaces labelled policy.sigstore.dev/include=true
# (the Astronomer release namespace). policy-controller runs with
# no-match-policy: deny (values.yaml), so every image the astronomer chart can
# render must match one policy below. A pod passes when, for every policy whose
# glob matches its image, at least one authority verifies.
#
# Coverage of the chart's images (deploy/policy_controller_test.go enforces it):
#   ghcr.io/alphabravo-oss/astronomer-*      first-party, keyless (release workflow)
#   ghcr.io/cloudnative-pg/cloudnative-pg    CNPG operator (bootstrap init container), bundle-signed: static pass
#   ghcr.io/cloudnative-pg/postgresql        CNPG PostgreSQL, bundle-signed: static pass
#   ghcr.io/dexidp/dex                       Dex, bundle-signed: static pass
#   index.docker.io/fluent/fluent-bit        management logging, bundle-signed: static pass
#   quay.io/jetstack/cert-manager-acmesolver HTTP-01 solver pods, cert-manager key
#   unsigned upstreams, digest-pinned        see astronomer-unsigned-digest-pinned
---
apiVersion: policy.sigstore.dev/v1beta1
kind: ClusterImagePolicy
metadata:
  name: astronomer-release-keyless
spec:
  mode: enforce
  images:
    - glob: "ghcr.io/alphabravo-oss/astronomer-**"
  authorities:
    - name: github-actions-release-workflow
      keyless:
        url: https://fulcio.sigstore.dev
        identities:
          - issuer: https://token.actions.githubusercontent.com
            subjectRegExp: '^https://github\.com/alphabravo-oss/astronomer/\.github/workflows/release\.yaml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'
      ctlog:
        url: https://rekor.sigstore.dev
---
apiVersion: policy.sigstore.dev/v1beta1
kind: ClusterImagePolicy
metadata:
  name: astronomer-deny-local-unsigned
spec:
  mode: enforce
  images:
    - glob: "localhost/**"
    - glob: "localhost:*/**"
    - glob: "127.0.0.1/**"
    - glob: "127.0.0.1:*/**"
  authorities:
    - name: never
      static:
        action: fail
        message: "unsigned local builds (localhost/*) are not allowed in the astronomer namespace; deploy the cosign-signed ghcr.io/alphabravo-oss release digests"
---
# Signed upstream, bundle format: this vendor signs with Sigstore *bundles*
# (OCI referrers). policy-controller 0.13.1 reports "no signatures found" for
# the legacy format and "bundle support for image signatures is not yet
# implemented" with signatureFormat: bundle, so admission cannot verify it.
# The digest pinned by the chart was verified out of band with cosign 3.1.3
# (`cosign verify --certificate-identity-regexp <subject below>`); the subject
# is kept here for that check. Replace the static pass with the keyless
# authority once policy-controller verifies bundles.
#   subject: ^https://github\.com/cloudnative-pg/cloudnative-pg/\.github/workflows/release-publish\.yml@refs/tags/v[0-9.]+$
# CloudNativePG operator image: the instance pods run it as the bootstrap init
# container. Install the operator with OPERATOR_IMAGE_NAME=<tag>@<digest>;
# a bare tag makes policy-controller's tag->digest mutation differ from the
# operator's expected image and every reconcile restarts the instances.
apiVersion: policy.sigstore.dev/v1beta1
kind: ClusterImagePolicy
metadata:
  name: vendor-cloudnative-pg-operator
spec:
  mode: enforce
  images:
    - glob: "ghcr.io/cloudnative-pg/cloudnative-pg**"
  authorities:
    - name: bundle-signed-digest-pinned
      static:
        action: pass
---
# Signed upstream, bundle format: this vendor signs with Sigstore *bundles*
