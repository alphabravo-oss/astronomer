# Residual unsigned upstreams. These publish no cosign signature (verified
# 2026-10-20 with cosign 3.1.3: "no signatures found"), so no authority can
# check them. The astronomer chart pins each by digest (image.requireDigest);
# this policy only names the exact repositories. Mirror them into a registry you
# sign (scripts/mirror-release.py) to replace this pass with a key authority.
apiVersion: policy.sigstore.dev/v1beta1
kind: ClusterImagePolicy
metadata:
  name: astronomer-unsigned-digest-pinned
spec:
  mode: enforce
  images:
    - glob: "index.docker.io/library/busybox**"
    - glob: "index.docker.io/library/postgres**"
    - glob: "index.docker.io/valkey/valkey**"
    - glob: "ghcr.io/cloudnative-pg/plugin-barman-cloud-sidecar**"
  authorities:
    - name: unsigned-upstream-digest-pinned
      static:
        action: pass
